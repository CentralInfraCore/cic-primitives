# DRAFT TEST VECTORS of the reader contract (OP-1), written from the RULES of reader-contract.yaml and from nothing else. They are a draft for review: NOT the approved 513 vectors, NOT the 47 extension cases, NOT a publication.
# kind: scalar = the document "- <text>" (a sequence of one item) and `expect.node` is that item; doc = the whole text, `expect.tree` is the typed tree; bytes = the input is the hex string, so that the encoding can be tested.
# expect.error = the reader error kind (the closed set of the contract); a vector has exactly one expectation. mode: plain (default) or schema (every key must be a str).
# The typed tree: [n] null, [b, true|false], [i, "<decimal>"], [f, "<16 hex digits of the IEEE binary64 bit pattern; all NaN are 7ff8000000000000>"], [s, "<text>"], [seq, [...]], [map, [[key, value], ...]] (the entries in source order).
# class: positive = a document the contract reads; negative = the reader error the contract states (or a near-miss that stays a str); boundary = an edge of a rule. The JSON-style lines are YAML flow mappings.
vectors_format: 1
vectors:
