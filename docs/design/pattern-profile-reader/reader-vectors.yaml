- {"id": "V-KY-017", "rule": "RC-15", "class": "boundary", "kind": "doc", "text": "{0.0: a, -0.0: b}", "expect": {"tree": ["map", [[["f", "0000000000000000"], ["s", "a"]], [["f", "8000000000000000"], ["s", "b"]]]]}, "note": "two different floats"}
- {"id": "V-KY-018", "rule": "RC-10", "class": "positive", "kind": "doc", "text": "{1: a, 1.0: b}", "expect": {"tree": ["map", [[["i", "1"], ["s", "a"]], [["f", "3ff0000000000000"], ["s", "b"]]]]}}
