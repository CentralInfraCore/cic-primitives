- {"id": "OQ-2", "rules": ["RC-02"], "question": "An empty input or only comments: the reader error `empty_document` (the draft) or a document whose value is null?", "draft": "reader error", "alternative": "an empty input, or only comments, is a document whose value is null", "alt_env": "oq2", "owner_provides": "choose the draft or the alternative", "affected_vectors": ["V-DC-001", "V-DC-002", "V-DC-003", "V-DC-004"]}
