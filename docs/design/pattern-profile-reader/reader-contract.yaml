# THE READER CONTRACT of the pattern profile (OP-1), DRAFT 1. The normative rules for how a document is read into a TYPED tree: the scalar resolution, the type identity, the explicit tags, the duplicate keys, the
# aliases and merge keys, the boundary between a reader error and a pattern verdict. A DRAFT FOR REVIEW: no rule here is accepted until the review and the owner say so, and it is not a publication. It is NOT derived from
# the behaviour of any parser (PyYAML, Go, Rust): the meaning is fixed here and the vectors (reader-vectors.yaml) are written from it; what a parser does is measured AFTERWARDS (docs/evidence/reader-contract).
# `basis`: owner_decision = stated in the owner's decision of 2026-11-23 (OP-1: the YAML 1.2 Core Schema, type preservation, strict reader rules) or an earlier owner decision;
#          review_recommendation = in the review's recommendation of 2026-11-23 (explicit tags, aliases and merge keys banned, duplicate keys rejected);
#          proposal = the author's proposal, to be CONFIRMED by the owner (each is also an open question where an alternative exists).
# The tree model: null, bool, int (arbitrary precision), float (IEEE binary64, NaN and the infinities), str (a sequence of Unicode code points), seq (ordered), map (an ORDERED list of (key, value) entries).
contract_format: 1
status: draft
refers_to: {specification: "docs/en/GRAMMAR-PATTERN-IMPLEMENTATION-SPEC.md (#52), obligations O-RD-01 to O-RD-06", plan_open_point: "OP-1 of docs/design/pattern-profile-plan/plan.yaml", record: "docs/design/pattern-profile-plan/decisions.yaml"}
modes:
  plain: "any scalar may be a mapping key (the pin values, section 3 of the specification)"
  schema: "every mapping key must be a string (O-RD-06); a non-string key is the reader error non_string_key"
error_kinds:
  # the closed set of this contract; the first five exist in the specification (O-RD-02, O-RD-04, O-RD-06), the others are new and are the reader's own vocabulary (D6)
  - {kind: yaml_syntax, origin: specification}
  - {kind: duplicate_key, origin: specification}
  - {kind: non_scalar_key, origin: specification}
  - {kind: non_string_key, origin: specification}
  - {kind: expression_not_a_string, origin: specification, note: "a schema-layer error (D5, O-RD-02); named here for the boundary only, the scalar reader never produces it"}
  - {kind: encoding, origin: contract}
  - {kind: empty_document, origin: contract}
  - {kind: multiple_documents, origin: contract}
  - {kind: directive_not_allowed, origin: contract}
  - {kind: anchor_not_allowed, origin: contract}
  - {kind: alias_not_allowed, origin: contract}
  - {kind: merge_key_not_allowed, origin: contract}
  - {kind: tag_not_allowed, origin: contract}
  - {kind: tag_mismatch, origin: contract}
  - {kind: float_overflow, origin: contract}
rules:
- {id: RC-01, basis: proposal, kinds: [encoding], topic: encoding, text: "The input is UTF-8 text. Bytes that are not valid UTF-8 (including an encoded lone surrogate), a UTF-8 byte order mark and any UTF-16 or UTF-32 input are the reader error `encoding`. Valid UTF-8 is read as a sequence of Unicode code points, with no normalisation."}
- {id: RC-02, basis: proposal, kinds: [empty_document, multiple_documents], topic: documents, text: "The input holds exactly one YAML document. No document (an empty input, or only comments or document markers) is `empty_document`; more than one document is `multiple_documents`. A single document may be written with the markers `---` and `...`."}
- {id: RC-03, basis: proposal, kinds: [directive_not_allowed], topic: directives, text: "Any directive (`%YAML`, `%TAG`, a reserved one) is the reader error `directive_not_allowed`: the contract is for one fixed reading and a directive changes it."}
- {id: RC-04, basis: owner_decision, kinds: [yaml_syntax], topic: syntax, text: "The input is YAML 1.2 (block and flow styles). Input that is not well-formed YAML 1.2 is `yaml_syntax`. A syntax error takes precedence over every other reader error (RC-17), whatever precedes or follows it."}
- {id: RC-05, basis: owner_decision, kinds: [], topic: scalar-resolution, text: "A PLAIN (unquoted) scalar is resolved by the YAML 1.2 Core Schema and by nothing else, in this order: null (`~`, `null`, `Null`, `NULL`, and the empty plain scalar), bool (`true`, `True`, `TRUE`, `false`, `False`, `FALSE`), int (RC-07), float (RC-08); every other plain scalar is a str. No other implicit type exists: no timestamp, no binary, no set, no sexagesimal number, no `y`/`n`/`yes`/`no`/`on`/`off` booleans."}
- {id: RC-06, basis: owner_decision, kinds: [], topic: scalar-resolution, text: "A quoted (single or double) scalar and a block scalar (`|`, `>`) is always a str, whatever its text looks like (`'1'`, `\"true\"`, `'~'`, `''` are strs)."}
- {id: RC-07, basis: owner_decision, kinds: [], topic: scalar-resolution, text: "An int is `[-+]?[0-9]+` (base 10; leading zeros do not make an octal: `010` is the int 10), `0o[0-7]+` (octal) or `0x[0-9a-fA-F]+` (hexadecimal, lower-case `0x`). Its value is an arbitrary-precision integer with no overflow. `-0` is the int 0. No other form is an int: no `_` separator, no `0b`, no `0`-prefixed octal, no `,`."}
- {id: RC-08, basis: owner_decision, kinds: [float_overflow], topic: scalar-resolution, text: "A float is `[-+]?(\\.[0-9]+|[0-9]+(\\.[0-9]*)?)([eE][-+]?[0-9]+)?`, or an infinity `[-+]?\\.(inf|Inf|INF)`, or a not-a-number `\\.(nan|NaN|NAN)` (unsigned). The value is the IEEE binary64 nearest to the decimal (ties to even); `-0.0` is a negative zero. A float that rounds to an infinity without being written as an infinity is the reader error `float_overflow`; a float that underflows is rounded (a subnormal or a zero) and accepted."}
- {id: RC-09, basis: owner_decision, kinds: [], topic: scalar-resolution, text: "Booleans and nulls have exactly the spellings of RC-05. `tRUE`, `NULl`, `yes` and `~~` are strs."}
- {id: RC-10, basis: owner_decision, kinds: [], topic: type-preservation, text: "Type preservation. The reader delivers the type class the rules give (null, bool, int, float, str, seq, map) and never coerces one to another: `1`, `true`, `1.0`, `'1'` and `null` are five different values. A host-language representation that treats two of them as equal (a Python dict that merges the keys 1, True and 1.0) is not an allowed representation."}
- {id: RC-11, basis: review_recommendation, kinds: [tag_not_allowed, tag_mismatch], topic: tags, text: "Explicit tags. Exactly seven tags are honoured, written `!!name` or `!<tag:yaml.org,2002:name>`: `str`, `int`, `float`, `bool`, `null`, `seq`, `map`. A tag fixes the type class and the value is read by the rule of that type on the node's text, quoted or not: `!!str` makes the text a str, `!!int` needs the int syntax of RC-07, `!!float` the float syntax of RC-08 (digits alone are a float syntax), `!!bool` and `!!null` their spellings; `!!seq` needs a sequence node and `!!map` a mapping node. A tag that does not fit its node is `tag_mismatch`. Every other tag (the non-specific `!`, a local `!x`, any other global tag, `!!set`, `!!omap`, `!!binary`, `!!timestamp`, `!!merge`, `!!python/...`, a verbatim tag of another name) is `tag_not_allowed`; that check comes before the fit check."}
- {id: RC-12, basis: review_recommendation, kinds: [anchor_not_allowed, alias_not_allowed, merge_key_not_allowed], topic: aliases, text: "No anchor (`&a`), no alias (`*a`, defined or not) and no merge key: an anchor is `anchor_not_allowed`, an alias `alias_not_allowed`, and a mapping key whose str value is `<<`, in any quoting, is `merge_key_not_allowed`. The tree has no shared structure and no expansion."}
- {id: RC-13, basis: owner_decision, kinds: [non_scalar_key, non_string_key], topic: keys, text: "A mapping key is a scalar of any type class (a null key is a key); a sequence or a mapping used as a key is `non_scalar_key`. In `schema` mode every key must be a str, else `non_string_key` (O-RD-06)."}
- {id: RC-14, basis: owner_decision, kinds: [duplicate_key], topic: keys, text: "Two keys of one mapping that are identical by RC-15 are the reader error `duplicate_key` (reported at the second). Keys of different type classes are different keys (`1`, `true`, `1.0`, `'1'` can stand in one mapping). The rule applies at every depth; keys of different mappings never clash."}
- {id: RC-15, basis: owner_decision, kinds: [], topic: identity, text: "Identity of scalars: the type class first; null equals null; bools by value; ints by mathematical value (`010`, `10` and `0xA` are one int); floats by the IEEE binary64 bit pattern, with every NaN identical to every other NaN and `0.0` different from `-0.0`; strs by code point sequence, case-sensitive, no normalisation (a plain and a quoted spelling of the same text are one str). Seqs are identical element by element in order, maps as sets of entries (a map is identical to another when the same keys carry identical values, in any order)."}
- {id: RC-16, basis: owner_decision, kinds: [], topic: order, text: "Mapping entries are exposed in SOURCE order and sequence items by index (O-RD-01); the tree is an ordered list of entries, and the order is part of what a conformance vector states."}
- {id: RC-17, basis: proposal, kinds: [], topic: precedence, text: "Precedence of the reader errors: `encoding`, then `yaml_syntax`, then `directive_not_allowed`, then `empty_document` and `multiple_documents`, then the semantic errors in SOURCE order of the offending node (depth-first, pre-order; for a duplicate key the second key). Within one node: `anchor_not_allowed`, `tag_not_allowed`, `tag_mismatch`, `float_overflow`, and for a key `merge_key_not_allowed`, `non_scalar_key`, `non_string_key`, `duplicate_key`. Exactly one error is reported."}
- {id: RC-18, basis: owner_decision, kinds: [], topic: boundary, text: "The reader's result is a typed tree or one reader error, nothing else. A reader error has no pattern code and the pattern validator never sees the document (O-RD-02). The errors of the schema layer (`expression_not_a_string`, D5) are decided by the layer that knows the schema and are outside this contract's scalar reader; the specification's tree-level rules (O-RD-03 document order of contracts, O-RD-04 raw typed pins) take this tree as their input."}
- {id: RC-19, basis: owner_decision, kinds: [], topic: independence, text: "Independence of parsers. The meaning of a document is these rules. The implicit typing of a host YAML library is not a source of truth: an implementation shows it conforms by the vectors, and any parser that disagrees is wrong for this contract, not the contract for the parser."}
