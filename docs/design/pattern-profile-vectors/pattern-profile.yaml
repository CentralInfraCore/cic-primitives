# Schemas: a pin state and the pattern contracts of the schema in document order. pin.state: ok (version stated and known), missing, unknown (a version that is not known),
# conflict (two different versions declared). Version 1 is the only known version. `at` is the 1-based position of the refused contract in document order.
schemas:
- {id: S-001, pin: {state: ok, version: 1}, contracts: [{path: '$.a', expr: '^[a-z]+$'}, {path: '$.b', expr: '^[0-9]{4}$'}], expect: accept, req: [R-SCHEMA-ORDER, R-PIN-FIRST]}
