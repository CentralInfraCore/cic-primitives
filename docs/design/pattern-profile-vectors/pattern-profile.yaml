# DRAFT normative vectors of the `pattern` contract profile (P1). Not published, not pinned, no gate reads them yet (HOLD); the profile version number 1 below is a working assumption of the
# vectors, fixed by the pin decision. Design and decisions: docs/en/GRAMMAR-PATTERN-PROFILE-DESIGN.md (#46), docs/en/GRAMMAR-PATTERN-ENGINE-SELECTION.md (#47),
# docs/en/GRAMMAR-PATTERN-LIMITS-AND-ERRORS.md (#48); this file and its rules: docs/en/GRAMMAR-PATTERN-VECTORS.md.
#
# Every expectation is AUTHORED BY HAND FROM THE SPECIFICATION TEXT, never copied from the output of an implementation. The prototypes (docs/evidence/pattern-limits-errors/) are run against
# the vectors afterwards (docs/evidence/pattern-vectors/); a disagreement is a finding about the vector, the text or the prototype, and is logged, not auto-corrected.
#
# Encoding (so that no reader depends on YAML escapes): an `expr` or a `value` is a plain string (printable ASCII only), or {seq: [...]} where each element is a plain string (literal ASCII
# text) or [codepoint, count] (that code point, count times). `pi` is the size PI of the expression (limits doc 2.1), derived by hand. `req` lists the requirement ids this vector exercises.
#
# Kinds: expressions (a text is accepted or refused, with ONE code), values (an accepted expression and a value: the verdict), schemas (pin state and expressions in document order).
vectors_format: 1
profile:
  name: pattern
  version: 1
limits:
  length: 256
  repeat_count: 255
  group_depth: 4
  repeat_product: 1000
  unbounded_quantifiers: 3
  pi_max: 2048
  value_code_points: 256
codes:
  expression:
  - pattern_empty
  - pattern_too_long
  - pattern_not_ascii_printable
  - pattern_empty_branch
  - pattern_unbalanced_group
  - pattern_group_extension
  - pattern_escape_unsupported
  - pattern_metachar_unexpected
  - pattern_anchor_misplaced
  - pattern_class_empty
  - pattern_class_negated
  - pattern_class_unterminated
  - pattern_class_range_order
  - pattern_class_nested_or_posix
  - pattern_class_set_operator
  - pattern_quantifier_malformed
  - pattern_quantifier_leading_zero
  - pattern_quantifier_bounds_order
  - pattern_quantifier_not_greedy
  - pattern_nesting_too_deep
  - pattern_repeat_count_too_large
  - pattern_repeat_product_too_large
  - pattern_unbounded_too_many
  - pattern_unbounded_on_group
  - pattern_program_too_large
  value:
  - pattern_value_not_unicode_scalar
  - pattern_value_too_long
  - pattern_value_mismatch
  pin:
  - pattern_profile_missing
  - pattern_profile_unknown
  - pattern_profile_conflict
# Requirements: id, the rule in one sentence, and where the rule is written (D = GRAMMAR-PATTERN-PROFILE-DESIGN, L = GRAMMAR-PATTERN-LIMITS-AND-ERRORS).
requirements:
- {id: R-MATCH-FULL, text: "the expression matches the whole value, not a part of it", src: "D 3.1"}
- {id: R-MATCH-ANCHOR-NOOP, text: "an outer ^ and an outer $ add nothing: ^a$ and a mean the same", src: "D 3.1"}
- {id: R-MATCH-DOT, text: "a dot matches exactly one code point except LF, also CR, NUL, U+2028, non-ASCII and astral code points", src: "D 3.3"}
- {id: R-MATCH-NO-TRAILING-LF, text: "a $ never lets a trailing LF through", src: "D 3.1"}
- {id: R-MATCH-CLASS, text: "a class is a set of ASCII members and ranges; a non-ASCII code point is never in it", src: "D 3.2, 3.3"}
- {id: R-MATCH-ALT, text: "alternation matches either branch, as a whole", src: "D 3.2"}
- {id: R-MATCH-QUANT, text: "the quantifiers * + ? {n} {n,m} {n,} repeat the atom the stated number of times", src: "D 3.2"}
- {id: R-MATCH-GROUP, text: "a plain group groups a sub-expression", src: "D 3.2"}
- {id: R-MATCH-ESCAPE, text: "an escaped metacharacter is that literal character", src: "D 3.2"}
- {id: R-MATCH-EMPTY, text: "the empty value matches exactly the expressions that can match nothing", src: "D 3.1"}
- {id: R-VALUE-SCALAR, text: "a value with a lone surrogate is pattern_value_not_unicode_scalar", src: "L 3.2 (value), D 3.3"}
- {id: R-VALUE-LENGTH, text: "a value of more than 256 code points is pattern_value_too_long, counted in code points; the matcher is not run", src: "D 3.4, L 3.2 (value)"}
- {id: R-VALUE-ORDER, text: "value order: not a scalar value, then too long, then match or mismatch", src: "L 3.2 (value)"}
- {id: R-VALUE-MISMATCH, text: "a value that does not match is pattern_value_mismatch", src: "L 3.1"}
- {id: R-T1-EMPTY, text: "the empty text is pattern_empty", src: "L 3.2 T1.1"}
- {id: R-T1-LENGTH, text: "more than 256 characters, anchors included, is pattern_too_long", src: "L 3.2 T1.2"}
- {id: R-T1-ASCII, text: "a character outside 0x20..0x7E is pattern_not_ascii_printable", src: "L 3.2 T1.3"}
- {id: R-T1-ORDER, text: "tier 1 order: empty, then too long, then not ASCII", src: "L 3.2 T1"}
- {id: R-BODY-ANCHORS, text: "the body is the text without a leading ^ and without a trailing $ that is preceded by an even number of backslashes", src: "L 3.2 Input"}
- {id: R-S1-DEPTH, text: "an alternation entered at depth above 4 is pattern_nesting_too_deep", src: "L 3.2 S1"}
- {id: R-S2-EMPTY-BRANCH, text: "a sequence without an item is pattern_empty_branch, where it ends", src: "L 3.2 S2"}
- {id: R-S3-GROUP-EXT, text: "(? is pattern_group_extension, before the depth check of the new group", src: "L 3.2 S3"}
- {id: R-S3-UNBALANCED, text: "a missing or a stray ) is pattern_unbalanced_group", src: "L 3.2 S3, S5"}
- {id: R-S3-ESCAPE, text: "an escape outside the list, or a trailing backslash, is pattern_escape_unsupported", src: "L 3.2 S3"}
- {id: R-S3-ANCHOR, text: "a ^ or $ where an atom is expected is pattern_anchor_misplaced", src: "L 3.2 S3"}
- {id: R-S3-METACHAR, text: "one of * + ? { } ] where an atom is expected is pattern_metachar_unexpected", src: "L 3.2 S3"}
- {id: R-C1-SET-OPERATOR, text: "the pairs && -- ~~ in the class text are pattern_class_set_operator, a pre-check before every other class rule; escaped pairs do not count", src: "L 3.2 C1"}
- {id: R-C2-NEGATED, text: "a first character ^ in a class is pattern_class_negated", src: "L 3.2 C2"}
- {id: R-C3-UNTERMINATED, text: "a class that ends before ] is pattern_class_unterminated", src: "L 3.2 C3"}
- {id: R-C3-NESTED, text: "[ inside a class is pattern_class_nested_or_posix", src: "L 3.2 C3"}
- {id: R-C3-ESCAPE, text: "an escape outside the list inside a class is pattern_escape_unsupported", src: "L 3.2 C3"}
- {id: R-C3-RANGE-ORDER, text: "a range end below its start is pattern_class_range_order, the range being completed before the next item", src: "L 3.2 C3"}
- {id: R-C4-EMPTY, text: "a class without an item is pattern_class_empty", src: "L 3.2 C4"}
- {id: R-Q1-UNBOUNDED-COUNT, text: "more than 3 unbounded quantifiers is pattern_unbounded_too_many", src: "L 3.2 Q1"}
- {id: R-Q2-UNBOUNDED-GROUP, text: "an unbounded quantifier on a group is pattern_unbounded_on_group", src: "L 3.2 Q2"}
- {id: R-Q3-LEADING-ZERO, text: "a count of two or more digits starting with 0 is pattern_quantifier_leading_zero", src: "L 3.2 Q3"}
- {id: R-Q4-BOUNDS-ORDER, text: "{n,m} with m below n is pattern_quantifier_bounds_order", src: "L 3.2 Q4"}
- {id: R-Q5-OPEN-BRACE, text: "{n,} counts as an unbounded quantifier", src: "L 3.2 Q5"}
- {id: R-Q5B-COUNT, text: "a count above 255 is pattern_repeat_count_too_large", src: "L 3.2 Q5b"}
- {id: R-Q5C-PRODUCT, text: "a product of enclosing counts above 1000 is pattern_repeat_product_too_large", src: "L 3.2 Q5c"}
- {id: R-Q6-STACKED, text: "a quantifier directly after a quantifier is pattern_quantifier_not_greedy", src: "L 3.2 Q6"}
- {id: R-Q-MALFORMED, text: "a { that is not {n}, {n,m} or {n,} is pattern_quantifier_malformed", src: "L 3.2 Q"}
- {id: R-T3-SIZE, text: "PI above 2048, decided on the whole tree after tiers 1 and 2, is pattern_program_too_large", src: "L 2.1, 3.2 T3"}
- {id: R-PI-RECURRENCE, text: "PI follows the recurrence of the limits document, construct by construct", src: "L 2.1"}
- {id: R-PI-ZERO-REPEAT, text: "a repeat with hi 0 contributes 0: a large sub-tree under {0} is not a large program", src: "L 2.1"}
- {id: R-LIM-LENGTH, text: "limit 256 of the text: 256 accepted, 257 refused", src: "D 3.4"}
- {id: R-LIM-COUNT, text: "limit 255 of a count: 255 accepted, 256 refused", src: "D 3.4"}
- {id: R-LIM-DEPTH, text: "limit 4 of the nesting: 4 accepted, 5 refused", src: "D 3.4"}
- {id: R-LIM-PRODUCT, text: "limit 1000 of the product: 1000 accepted, 1001 refused", src: "D 3.4"}
- {id: R-LIM-UNBOUNDED, text: "limit 3 of the unbounded quantifiers: 3 accepted, 4 refused", src: "D 3.4"}
- {id: R-LIM-PI, text: "limit 2048 of PI: 2048 accepted, 2049 refused", src: "L 2.2"}
- {id: R-LIM-VALUE, text: "limit 256 of the value: 256 code points accepted, 257 refused", src: "D 3.4"}
- {id: R-PREC-TIER, text: "tier order: whole-text checks, then the scan, then the size", src: "L 3.2"}
- {id: R-PREC-READING-ORDER, text: "inside the scan the first rule that fires in reading order wins", src: "L 3.2 Tier 2"}
- {id: R-PREC-CLASS-ORDER, text: "inside a class the order is C1, C2, then the items from left to right, then C4", src: "L 3.2 Classes"}
- {id: R-PREC-REPEAT-ORDER, text: "inside a quantifier the order is Q1, Q2 (or the brace checks Q3, Q4, Q5, Q5b, Q5c), then Q6", src: "L 3.2 Quantifiers"}
- {id: R-PREC-GROUP-EXT-DEPTH, text: "at a ( the group-extension check comes before the depth check", src: "L 3.2 S3"}
- {id: R-SCHEMA-ORDER, text: "a schema is refused with the code of the first refused expression in document order, whatever the tier", src: "L 3.2"}
- {id: R-SCHEMA-WHOLE, text: "a schema with one refused expression is refused as a whole; there is no partial acceptance and no fallback", src: "D 3.5"}
- {id: R-PIN-MISSING, text: "a schema with a pattern contract and no pin is pattern_profile_missing", src: "D 4.1, O1, O6"}
- {id: R-PIN-UNKNOWN, text: "an unknown pin version is pattern_profile_unknown", src: "D 4.1"}
- {id: R-PIN-CONFLICT, text: "conflicting pin versions are pattern_profile_conflict", src: "D 4.1"}
- {id: R-PIN-FIRST, text: "the pin errors precede every expression check", src: "L 3.2"}
- {id: R-PIN-ONLY-IF-PATTERN, text: "a schema without any pattern contract needs no pin", src: "D 4.3, O6"}
- {id: R-COMPAT-CONTRACTS, text: "the 9 existing expressions are accepted with the stated PI, and their values keep their verdict", src: "D 4.3"}
# Requirements a verdict vector cannot test. They are listed so that the matrix is honest; each names where it must be tested instead.
not_testable_by_vectors:
- {id: R-LINEAR, text: "the evaluator is linear in program size times value length and never backtracks", where: "a timing gate on adversarial input (HOLD)"}
- {id: R-INDEPENDENT-CHECK, text: "producer and verifier each check, the verifier never relies on the producer", where: "the implementations of the producer and the verifier (HOLD)"}
- {id: R-VERSION-EVIDENCE, text: "the run evidence names the implementation that ran (E3)", where: "the CI gate (HOLD)"}
- {id: R-VERIFIER-BUDGET, text: "a verifier of untrusted input applies its own total budget", where: "the verifier, outside this profile (L 2.5)"}
expressions:
# ---- accepted expressions with the hand-derived PI (the recurrence of L 2.1: atom 1; sequence the sum; alternation 1 + branches; {lo,hi} lo*x + (hi-lo)*(1+x); unbounded 1 + (lo+1)*x)
- {id: X-A001, expr: 'a', expect: accept, pi: 1, req: [R-PI-RECURRENCE]}
- {id: X-A002, expr: '.', expect: accept, pi: 1, req: [R-PI-RECURRENCE, R-MATCH-DOT]}
- {id: X-A003, expr: '[a-z]', expect: accept, pi: 1, req: [R-PI-RECURRENCE, R-MATCH-CLASS]}
- {id: X-A004, expr: 'ab', expect: accept, pi: 2, req: [R-PI-RECURRENCE]}
- {id: X-A005, expr: 'a|b', expect: accept, pi: 3, req: [R-PI-RECURRENCE, R-MATCH-ALT]}
- {id: X-A006, expr: '(a|b)', expect: accept, pi: 3, req: [R-PI-RECURRENCE, R-MATCH-GROUP]}
- {id: X-A007, expr: 'a|b|c', expect: accept, pi: 4, req: [R-PI-RECURRENCE]}
- {id: X-A008, expr: '(a|b)(c|d)', expect: accept, pi: 6, req: [R-PI-RECURRENCE]}
- {id: X-A009, expr: 'a?', expect: accept, pi: 2, req: [R-PI-RECURRENCE]}
- {id: X-A010, expr: 'a*', expect: accept, pi: 2, req: [R-PI-RECURRENCE]}
- {id: X-A011, expr: 'a+', expect: accept, pi: 3, req: [R-PI-RECURRENCE]}
- {id: X-A012, expr: 'a{3}', expect: accept, pi: 3, req: [R-PI-RECURRENCE]}
- {id: X-A013, expr: 'a{2,5}', expect: accept, pi: 8, req: [R-PI-RECURRENCE]}
- {id: X-A014, expr: 'a{2,}', expect: accept, pi: 4, req: [R-PI-RECURRENCE, R-Q5-OPEN-BRACE]}
- {id: X-A015, expr: 'a{0}b', expect: accept, pi: 1, req: [R-PI-RECURRENCE, R-PI-ZERO-REPEAT]}
- {id: X-A016, expr: 'a{0,255}', expect: accept, pi: 510, req: [R-PI-RECURRENCE, R-LIM-COUNT]}
- {id: X-A017, expr: '(ab){2}', expect: accept, pi: 4, req: [R-PI-RECURRENCE]}
- {id: X-A018, expr: '(a|b){0,2}', expect: accept, pi: 8, req: [R-PI-RECURRENCE]}
- {id: X-A019, expr: '(a{2}){3}', expect: accept, pi: 6, req: [R-PI-RECURRENCE]}
- {id: X-A020, expr: '((a?){2}){3}', expect: accept, pi: 12, req: [R-PI-RECURRENCE]}
- {id: X-A021, expr: 'a{0}', expect: accept, pi: 0, req: [R-PI-RECURRENCE, R-PI-ZERO-REPEAT]}
- {id: X-A022, expr: 'a{255}', expect: accept, pi: 255, req: [R-LIM-COUNT]}
- {id: X-A023, expr: 'a{255,}', expect: accept, pi: 257, req: [R-LIM-COUNT, R-Q5-OPEN-BRACE]}
- {id: X-A024, expr: 'a{2,2}', expect: accept, pi: 2, req: [R-PI-RECURRENCE]}
- {id: X-A025, expr: '(a{0}){255}', expect: accept, pi: 0, req: [R-PI-ZERO-REPEAT]}
- {id: X-A026, expr: '((a?){10}){10}', expect: accept, pi: 200, req: [R-PI-RECURRENCE, R-Q5C-PRODUCT]}
- {id: X-A027, expr: '(a{0,255}a{0,255}a{0,255}a{0,255}a{0,255}){0}b', expect: accept, pi: 1, req: [R-PI-ZERO-REPEAT, R-T3-SIZE]}
- {id: X-A028, expr: '(a{10}b){0,3}', expect: accept, pi: 36, req: [R-PI-RECURRENCE]}
# ---- anchors and the body (R-BODY-ANCHORS): a trailing $ is the outer anchor iff an even number (zero included) of backslashes precedes it
- {id: X-A030, expr: '^a$', expect: accept, pi: 1, req: [R-BODY-ANCHORS, R-MATCH-ANCHOR-NOOP]}
- {id: X-A031, expr: '^a', expect: accept, pi: 1, req: [R-BODY-ANCHORS]}
- {id: X-A032, expr: 'a$', expect: accept, pi: 1, req: [R-BODY-ANCHORS]}
- {id: X-A033, expr: 'a\$', expect: accept, pi: 2, req: [R-BODY-ANCHORS, R-MATCH-ESCAPE]}
- {id: X-A034, expr: '^a\$$', expect: accept, pi: 2, req: [R-BODY-ANCHORS]}
- {id: X-A035, expr: 'a\\$', expect: accept, pi: 2, req: [R-BODY-ANCHORS]}
- {id: X-A036, expr: 'a\\\$', expect: accept, pi: 3, req: [R-BODY-ANCHORS]}
- {id: X-A037, expr: '[a]\$', expect: accept, pi: 2, req: [R-BODY-ANCHORS]}
- {id: X-A038, expr: 'a b', expect: accept, pi: 3, req: [R-T1-ASCII]}
- {id: X-A039, expr: 'a~b', expect: accept, pi: 3, req: [R-T1-ASCII]}
# ---- every escape of the list is accepted (outside a class)
- {id: X-A040, expr: '\\', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A041, expr: '\.', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A042, expr: '\[', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A043, expr: '\]', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A044, expr: '\(', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A045, expr: '\)', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A046, expr: '\{', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A047, expr: '\}', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A048, expr: '\*', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A049, expr: '\+', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A050, expr: '\?', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A051, expr: '\|', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A052, expr: '\^', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
- {id: X-A053, expr: '\$', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE, R-BODY-ANCHORS]}
- {id: X-A054, expr: '\-', expect: accept, pi: 1, req: [R-MATCH-ESCAPE, R-S3-ESCAPE]}
# ---- accepted classes (the class rules do not fire)
- {id: X-A060, expr: '[a-z0-9._-]', expect: accept, pi: 1, req: [R-MATCH-CLASS]}
- {id: X-A061, expr: '[a-]', expect: accept, pi: 1, req: [R-MATCH-CLASS, R-C1-SET-OPERATOR]}
- {id: X-A062, expr: '[-a]', expect: accept, pi: 1, req: [R-MATCH-CLASS]}
- {id: X-A063, expr: '[a&b]', expect: accept, pi: 1, req: [R-C1-SET-OPERATOR]}
- {id: X-A064, expr: '[a~b]', expect: accept, pi: 1, req: [R-C1-SET-OPERATOR]}
- {id: X-A065, expr: '[a\-\-b]', expect: accept, pi: 1, req: [R-C1-SET-OPERATOR, R-C3-ESCAPE]}
- {id: X-A066, expr: '[a-a]', expect: accept, pi: 1, req: [R-C3-RANGE-ORDER]}
- {id: X-A067, expr: '[a^b]', expect: accept, pi: 1, req: [R-C2-NEGATED]}
- {id: X-A068, expr: '[.]', expect: accept, pi: 1, req: [R-MATCH-CLASS]}
- {id: X-A069, expr: '[$*+?(){}|]', expect: accept, pi: 1, req: [R-MATCH-CLASS]}
- {id: X-A070, expr: '[\]]', expect: accept, pi: 1, req: [R-C3-ESCAPE, R-MATCH-ESCAPE]}
- {id: X-A071, expr: '[\\]', expect: accept, pi: 1, req: [R-C3-ESCAPE, R-MATCH-ESCAPE]}
- {id: X-A072, expr: '[\^\-\.]', expect: accept, pi: 1, req: [R-C3-ESCAPE, R-MATCH-ESCAPE]}
# ---- the nine existing contracts (R-COMPAT-CONTRACTS), PI derived by hand
- {id: X-C001, expr: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$', expect: accept, pi: 17, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C002, expr: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$', expect: accept, pi: 32, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C003, expr: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', expect: accept, pi: 10, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C004, expr: '^[0-9a-f]{40}$', expect: accept, pi: 40, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C005, expr: '^sha256:[0-9a-f]{64}$', expect: accept, pi: 71, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C006, expr: '^[A-Za-z0-9+/]{43}=$', expect: accept, pi: 44, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C007, expr: '^vault:v1:.+$', expect: accept, pi: 12, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C008, expr: '^[a-z0-9][a-z0-9./_:-]*$', expect: accept, pi: 3, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
- {id: X-C009, expr: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$', expect: accept, pi: 27, req: [R-COMPAT-CONTRACTS, R-PI-RECURRENCE]}
# ---- tier 1: the whole text (R-T1-*), in the order empty, too long, not ASCII
- {id: X-T101, expr: '', expect: refuse, code: pattern_empty, req: [R-T1-EMPTY]}
- {id: X-T102, expr: {seq: [[97, 257]]}, expect: refuse, code: pattern_too_long, req: [R-T1-LENGTH, R-LIM-LENGTH]}
- {id: X-T103, expr: {seq: [[97, 256]]}, expect: accept, pi: 256, req: [R-LIM-LENGTH]}
- {id: X-T104, expr: {seq: ['^', [97, 255], '$']}, expect: refuse, code: pattern_too_long, req: [R-T1-LENGTH, R-LIM-LENGTH]}
- {id: X-T105, expr: {seq: ['^', [97, 254], '$']}, expect: accept, pi: 254, req: [R-LIM-LENGTH, R-BODY-ANCHORS]}
- {id: X-T106, expr: {seq: [[40, 300]]}, expect: refuse, code: pattern_too_long, req: [R-T1-ORDER, R-PREC-TIER]}
- {id: X-T107, expr: {seq: [[233, 300]]}, expect: refuse, code: pattern_too_long, req: [R-T1-ORDER]}
- {id: X-T108, expr: {seq: ['a', [233, 1]]}, expect: refuse, code: pattern_not_ascii_printable, req: [R-T1-ASCII]}
- {id: X-T109, expr: {seq: ['a', [9, 1], 'b']}, expect: refuse, code: pattern_not_ascii_printable, req: [R-T1-ASCII]}
