# The IMPLEMENTATION PLAN of the pattern profile (version 1): the 27 obligations of docs/design/pattern-profile-spec/obligations.yaml cut into implementation units, tests and acceptance gates, in the order the owner's
# professional recommendation proposes. Companion of docs/en/GRAMMAR-PATTERN-IMPLEMENTATION-PLAN.md, checked by docs/evidence/pattern-impl-plan/check_impl_plan.py.
# THIS IS A PLAN, NOT AN IMPLEMENTATION: no module named here exists, none is created by this package, and executing the plan needs a separate owner GO. Paths are PROPOSALS for the primary implementation.
# tests: approved:expressions|values|schemas = the approved vectors of that kind; extension:E-PIN|E-TRV|E-RDR = the proposed extension cases of that group (a separately reviewed extension); plan:P-NN = a plan item of obligations.yaml.
plan_format: 1
approved_vector_file_sha256: e7ece43a9486187c16a482a96a86d22cf82407711be940920155f4e3abe277e0
language: Python
repository: cic-primitives
proposed_layout:
  package: tools/pattern_profile/
  tests: tests/pattern_profile/
  note: "paths are proposals; the evaluator is the own automaton (E1), google-re2 an optional cross-check (E2), Go regexp and Rust regex the native cross-check, the run evidence names the implementation (E3)"
conformance_base:
  approved: 513
  extension_proposed: 47
  total_if_all_accepted: 560
  rule: "the first implementation is accepted against the 513 approved vectors; the extension is a separate, separately reviewed result; the 513 keep their own integrity reference"
milestones:
- {id: M0, name: "owner prerequisites", step: 1, units: [], gates: [G-0], hold: false, text: "the owner confirms D1 to D6 (the decisions the specification and the extension cases rest on)"}
- {id: M1, name: "the 47 extension cases reviewed and accepted, rejected or deferred", step: 2, units: [], gates: [G-0], hold: false, text: "the review package of the extension cases; acceptance is a separate decision and a separate pull request"}
- {id: M2, name: "the implementation plan accepted", step: 3, units: [], gates: [], hold: false, text: "this package"}
- {id: M3, name: "the primary implementation (Python)", step: 4, units: [U-01, U-02, U-03, U-04, U-05, U-06, U-07], gates: [G-1, G-2, G-3, G-4, G-5, G-6, G-8, G-10], hold: true, text: "reader, record values, pin, classifier, evaluator, schema validator, evidence keys"}
- {id: M4, name: "the independent implementation and the comparison", step: 5, units: [], gates: [G-11], hold: true, text: "another developer, another language, from the specification and the vectors only; the results are compared"}
- {id: M5, name: "producer and verifier integration", step: 6, units: [U-08, U-09], gates: [G-7, G-9], hold: true, text: "producer build checks, the independent verifier with its own budget"}
- {id: M6, name: "the CI gate and the normative publication", step: 7, units: [U-10], gates: [G-12, G-13], hold: true, text: "gate wiring, the normative publication of the vectors; the deferred composition and record-order work (D7, D8)"}
units:
- {id: U-01, name: "typed document reader", obligations: [O-RD-01, O-RD-02, O-RD-03, O-RD-04, O-RD-06], module: reader.py, milestone: M3, after: [], tests: ["extension:E-RDR", "extension:E-TRV", "extension:E-PIN", "plan:P-06", "plan:P-07", "plan:P-08"], needs: [D1, D4, D5, D6], text: "source-order mappings, a type-preserving representation of pin values (TMap), duplicate keys by the identity rule, string keys of the schema document, the document-order traversal, reader errors with no pattern code"}
- {id: U-02, name: "record value delivery", obligations: [O-RD-05], module: values.py, milestone: M3, after: [], tests: ["approved:values", "plan:P-05"], needs: [], text: "pattern-constrained string values as sequences of code points, a lone surrogate flagged, never replaced; a non-string is not a verdict of the profile"}
- {id: U-03, name: "pin resolution and the identity of declared values", obligations: [O-VA-01, O-VA-02], module: pin.py, milestone: M3, after: [U-01], tests: ["approved:schemas", "extension:E-PIN", "plan:P-07"], needs: [D1, D2, D3], text: "missing, conflict before unknown, identical declarations as one, the exact int 1, the recursive type-sensitive identity, evaluated only with a pattern contract and before every expression"}
- {id: U-04, name: "expression classifier", obligations: [O-VA-03, O-VA-04, O-VA-05, O-VA-06, O-VA-07, O-VA-08, O-VA-10], module: classifier.py, milestone: M3, after: [], tests: ["approved:expressions"], needs: [], text: "tier 1, the scan, the class and quantifier rules in their order, the size PI on the whole tree, one code per refused expression, the nine existing contracts"}
- {id: U-05, name: "evaluator (own automaton)", obligations: [O-VA-11, O-VA-12, O-VA-13], module: evaluator.py, milestone: M3, after: [U-04, U-02], tests: ["approved:values", "plan:P-01", "plan:P-05"], needs: [], text: "full match over code points, the value order, linear work bounded by c x (PI+1) x (N+1), never backtracking"}
- {id: U-06, name: "schema validator", obligations: [O-VA-09], module: validator.py, milestone: M3, after: [U-01, U-03, U-04], tests: ["approved:schemas", "extension:E-TRV", "plan:P-08"], needs: [D4], text: "over the contracts in the order the reader delivers them: the pin, then the first refused expression decides code and path; the schema is refused as a whole"}
- {id: U-07, name: "evidence keys and run evidence", obligations: [O-GT-02, O-VF-04], module: evidence.py, milestone: M3, after: [U-03, U-06], tests: ["plan:P-10", "plan:P-03"], needs: [], text: "the typed canonical encoding, the component digests, the class key and the evidence identifier with their domain tags, the scope (a successful document read only), the implementation identity and the conformance reference"}
- {id: U-08, name: "producer checks", obligations: [O-PR-01, O-PR-02], module: producer.py, milestone: M5, after: [U-06, U-05], tests: ["plan:P-02", "plan:P-11"], needs: [], text: "resolve the pin and classify every expression at build time and refuse the build; check every emitted value and refuse to emit a violating one"}
- {id: U-09, name: "independent verifier", obligations: [O-VF-01, O-VF-02, O-VF-03], module: verifier.py, milestone: M5, after: [U-06, U-05], tests: ["plan:P-02", "plan:P-07", "plan:P-04"], needs: [], text: "steps 0 to 3 independently of the producer, a refused schema before any value, its own total work budget with its own code, each distinct expression compiled once"}
- {id: U-10, name: "gate harness", obligations: [O-GT-01], module: "tests/pattern_profile/gate", milestone: M6, after: [U-07, U-08, U-09], tests: ["plan:P-01", "plan:P-03"], needs: [], text: "runs the approved vectors and, if accepted, the extension cases against every implementation with typed exits and canaries; records the run evidence; the wiring into CI is on hold"}
gates:
- {id: G-0, name: "owner prerequisites", criteria: "D1 to D6 confirmed by the owner; the 47 extension cases accepted, rejected or deferred by the owner", evidence: "the owner's recorded decisions", approval: owner, typed_exits: false, plan_items: [], hold: false}
- {id: G-1, name: "reader", criteria: "every reader error of the cases has its kind and no pattern code; source order and the key types of a pin value are kept; the traversal order cases pass", evidence: "results of E-RDR, E-TRV and the reader tests of plan item P-06", approval: review, typed_exits: true, plan_items: [P-06], hold: false}
- {id: G-2, name: "approved vector conformance", criteria: "all 513 approved vectors pass in the implementation (expression verdicts and PI, value verdicts, schema verdicts with the whole triple); 0 disagreements", evidence: "a conformance run with typed exits (0 ok, 1 a DISAGREE line, 2 infrastructure, 3 a failed canary of a native runner)", approval: review, typed_exits: true, plan_items: [], hold: false}
- {id: G-3, name: "extension conformance", criteria: "the accepted extension cases pass, reported separately from G-2; 560 in total only if all 47 are accepted unchanged", evidence: "the same run over the extension file with its own integrity reference", approval: review, typed_exits: true, plan_items: [P-07, P-08], hold: false}
- {id: G-4, name: "native cross-check", criteria: "Go regexp and Rust regex agree with the implementation on the value verdicts, and every accepted expression with PI <= 2048 compiles in every engine (rule D); the optional google-re2 cross-check, if used, is reported with its version", evidence: "the native run with the canaries of the existing runners", approval: review, typed_exits: true, plan_items: [], hold: false}
- {id: G-5, name: "harness self-test", criteria: "the conformance harness of the implementation can fail, for the right reason: a positive control, planted defects of the implementation each detected with the intended line, infrastructure controls that exit 2", evidence: "the self-test output", approval: review, typed_exits: true, plan_items: [], hold: false}
- {id: G-6, name: "work bound", criteria: "the deterministic work of the evaluator is at most c x (PI+1) x (N+1) on the adversarial corpus, the zero-size program and the empty value included; the constant is fixed in the measurement", evidence: "the work counter per case and the implementation identity", approval: review, typed_exits: true, plan_items: [P-01], hold: false}
- {id: G-7, name: "producer and verifier independence", criteria: "a producer stub that reports success for violating input is refused by the verifier's own checks; the producer refuses exactly as the validator does on the approved schema and value vectors", evidence: "the refusals per stub and per vector", approval: review, typed_exits: true, plan_items: [P-02, P-11], hold: false}
- {id: G-8, name: "evidence keys and run evidence", criteria: "a changed pin with unchanged contracts never makes a result reusable; a component digest alone is never a reuse key; a document the reader refused gets no key; the run evidence names the implementation", evidence: "the key and property checks and the versions record of the run", approval: review, typed_exits: true, plan_items: [P-10, P-03], hold: false}
- {id: G-9, name: "verifier budget", criteria: "the verifier stops at its own budget with its own code; the work is additive in contracts and values; a fixed cost per contract and per value is included", evidence: "the budget code and the work spent on synthetic schemas and records", approval: review, typed_exits: true, plan_items: [P-04], hold: false}
- {id: G-10, name: "code points and language notes", criteria: "a lone surrogate is decided by the reader before the conversion and the length is counted in code points in every language of the run", evidence: "the harness verdicts for the surrogate and the length vectors", approval: review, typed_exits: true, plan_items: [P-05], hold: false}
- {id: G-11, name: "independent implementation comparison", criteria: "a second implementation by another developer in another language from the specification and the vectors only; the results are compared with the primary one; every difference is logged and decided, never auto-corrected", evidence: "the comparison record", approval: owner, typed_exits: true, plan_items: [], hold: true}
- {id: G-12, name: "CI gate and normative publication", criteria: "the gate wired into CI with the required-run switches; the vectors published normatively; both are owner decisions", evidence: "the owner's approvals", approval: owner, typed_exits: false, plan_items: [], hold: true}
- {id: G-13, name: "deferred composition and record order", criteria: "the composition of schema parts and the order of several violating values are specified and their cases reviewed (D7, D8)", evidence: "the specification extension", approval: owner, typed_exits: false, plan_items: [P-09], hold: true}
out_of_scope:
- "the integration of the Forms (a separate work package)"
- "implementations in Go and Rust (they are used only as the native cross-check of value verdicts)"
- "the composition of schema parts and the order of several violating values (D7, D8)"
- "any change of the approved vector file, the schemas, the grammar or a checker of the repository"
open_points:
- {id: OP-1, text: "the YAML scalar resolution rules: the type class of a pin value depends on the resolver (YAML 1.1 as in PyYAML reads on, off, 010 and 1_000 as bool and int; YAML 1.2 does not); the specification says the reader delivers raw typed values but not which scalar schema; the plan proposes to fix one (the YAML 1.2 core schema) with its own reader tests, for the owner to decide before the reader is written"}
- {id: OP-2, text: "whether the 47 extension cases are accepted unchanged, in part or deferred (gate G-0)"}
- {id: OP-3, text: "the constant c of the work bound and the counted operations, fixed in the measurement of G-6"}
- {id: OP-4, text: "whether the native cross-check runs in CI (toolchains) or only in the gate harness run"}
risks:
- {id: RK-1, text: "the Python evaluator may be slower than the native engines by one to two orders of magnitude (measured: own 21 ms against Go 3 ms and Rust 61 ms cold at PI 2048); acceptable for release verification, but the budget of the verifier must account for it"}
- {id: RK-2, text: "PyYAML resolves scalars by YAML 1.1 and merges equal keys of different types in a dictionary: a custom loader is required (see OP-1)"}
- {id: RK-3, text: "the specification, the vectors and the prototypes share an author: the independent implementation (G-11) is the real test"}
