# Implementation obligations of the pattern profile (version 1) and their traceability to the 66 requirements of the approved vector set (docs/design/pattern-profile-vectors/pattern-profile.yaml) and to the
# 4 requirements that a verdict vector cannot test. Companion of docs/en/GRAMMAR-PATTERN-IMPLEMENTATION-SPEC.md (the text) and checked by docs/evidence/pattern-spec-trace/check_spec_trace.py.
# roles: reader (the document reader), validator (the pattern validator), producer, verifier, gate (the CI gate, on hold).
# verify: `vectors` = the obligation is exercised by the approved vectors that name its requirements; `plan` = ids of verification-plan items below (for what the 513 vectors do not cover).
obligations_format: 1
approved_vector_file_sha256: e7ece43a9486187c16a482a96a86d22cf82407711be940920155f4e3abe277e0
obligations:
- {id: O-RD-01, roles: [reader], text: "a mapping's entries are exposed in SOURCE order and a sequence's items by index; an implementation whose map type loses the order uses an order-preserving representation", reqs: [R-SCHEMA-ORDER], verify: {plan: [P-06, P-08]}}
- {id: O-RD-02, roles: [reader], text: "a duplicate mapping key, a YAML syntax error and a pattern contract whose expression is absent or not a string are READER errors before the validator runs, outside the pattern code set; the validator never receives them", reqs: [R-SCHEMA-WHOLE], verify: {plan: [P-06]}}
- {id: O-RD-03, roles: [reader], text: "the pattern contracts of the composed schema are delivered to the validator in DOCUMENT ORDER: depth-first pre-order, mapping entries in source order, sequence items by index, a contract visited where its key stands among its siblings", reqs: [R-SCHEMA-ORDER], verify: {plan: [P-08, P-09]}}
- {id: O-RD-04, roles: [reader], text: "the pin declarations are delivered as RAW TYPED values in document order (no coercion: 1, the text 1, 1.0, true and null are different values); a declaration with the value null is a declaration; an absent key is no declaration", reqs: [R-PIN-MISSING, R-PIN-UNKNOWN, R-PIN-CONFLICT, R-PIN-IDENTICAL], verify: {plan: [P-07]}}
- {id: O-RD-05, roles: [reader], text: "the values of a record to be checked against a pattern contract are extracted by the record layer; a value that is not a string is not a verdict of the pattern profile (the type contract of the node decides); a string is delivered as a sequence of Unicode code points, a lone surrogate flagged, never silently replaced", reqs: [R-VALUE-SCALAR], verify: {plan: [P-05]}}
- {id: O-VA-01, roles: [validator], text: "pin resolution: no declaration is pattern_profile_missing; declarations that are not all identical in type and value are pattern_profile_conflict (before unknown); a single value that is not exactly the int 1 is pattern_profile_unknown (a wrong-typed value included); identical declarations count as one", reqs: [R-PIN-MISSING, R-PIN-UNKNOWN, R-PIN-CONFLICT, R-PIN-IDENTICAL], verify: {vectors: true, plan: [P-07]}}
- {id: O-VA-02, roles: [validator], text: "the pin is evaluated only when the schema has at least one pattern contract, and before every expression", reqs: [R-PIN-ONLY-IF-PATTERN, R-PIN-FIRST], verify: {vectors: true, plan: [P-07]}}
- {id: O-VA-03, roles: [validator], text: "tier 1 on the whole text (empty, too long counted in characters with the anchors, not ASCII printable) in this order, and the body: the leading ^ and a trailing $ preceded by an even number of backslashes are removed", reqs: [R-T1-EMPTY, R-T1-LENGTH, R-T1-ASCII, R-T1-ORDER, R-BODY-ANCHORS, R-LIM-LENGTH], verify: {vectors: true}}
- {id: O-VA-04, roles: [validator], text: "the scan rules S1 to S5: nesting depth, empty branch, group extension before depth, unbalanced group, escapes, anchors, metacharacters", reqs: [R-S1-DEPTH, R-S2-EMPTY-BRANCH, R-S3-GROUP-EXT, R-S3-UNBALANCED, R-S3-ESCAPE, R-S3-ANCHOR, R-S3-METACHAR, R-LIM-DEPTH, R-PREC-GROUP-EXT-DEPTH], verify: {vectors: true}}
- {id: O-VA-05, roles: [validator], text: "the class rules C1 to C4 in their order: the set-operator pre-check first, then negation, then the items from left to right, then the empty class", reqs: [R-C1-SET-OPERATOR, R-C2-NEGATED, R-C3-UNTERMINATED, R-C3-NESTED, R-C3-ESCAPE, R-C3-RANGE-ORDER, R-C4-EMPTY, R-PREC-CLASS-ORDER], verify: {vectors: true}}
- {id: O-VA-06, roles: [validator], text: "the quantifier rules Q1 to Q6 in their order, and the limits of the counts, the product and the unbounded quantifiers", reqs: [R-Q1-UNBOUNDED-COUNT, R-Q2-UNBOUNDED-GROUP, R-Q3-LEADING-ZERO, R-Q4-BOUNDS-ORDER, R-Q5-OPEN-BRACE, R-Q5B-COUNT, R-Q5C-PRODUCT, R-Q6-STACKED, R-Q-MALFORMED, R-LIM-COUNT, R-LIM-PRODUCT, R-LIM-UNBOUNDED, R-PREC-REPEAT-ORDER], verify: {vectors: true}}
- {id: O-VA-07, roles: [validator], text: "tier 3: PI by the recurrence on the whole tree after tiers 1 and 2, refused above 2048; a zero repeat contributes zero; no early refusal on a sub-tree", reqs: [R-T3-SIZE, R-PI-RECURRENCE, R-PI-ZERO-REPEAT, R-LIM-PI], verify: {vectors: true}}
- {id: O-VA-08, roles: [validator], text: "one code per refused expression: the first rule that fires, in the order tier 1, the scan, tier 3", reqs: [R-PREC-TIER, R-PREC-READING-ORDER], verify: {vectors: true}}
- {id: O-VA-09, roles: [validator], text: "over the contracts in the order the reader delivers them: the first refused expression decides the code and the path; a schema with one refused expression is refused as a whole, no fallback, no partial acceptance", reqs: [R-SCHEMA-ORDER, R-SCHEMA-WHOLE], verify: {vectors: true, plan: [P-08]}}
- {id: O-VA-10, roles: [validator], text: "the nine existing expressions are accepted with their PI and their values keep their verdicts", reqs: [R-COMPAT-CONTRACTS], verify: {vectors: true}}
- {id: O-VA-11, roles: [validator], text: "matching semantics: full match of the whole value; outer anchors add nothing; a dot is one code point except LF; no trailing LF through a $; classes are ASCII; alternation, quantifiers, groups, escapes; the empty value", reqs: [R-MATCH-FULL, R-MATCH-ANCHOR-NOOP, R-MATCH-DOT, R-MATCH-NO-TRAILING-LF, R-MATCH-CLASS, R-MATCH-ALT, R-MATCH-QUANT, R-MATCH-GROUP, R-MATCH-ESCAPE, R-MATCH-EMPTY], verify: {vectors: true}}
- {id: O-VA-12, roles: [validator], text: "value order: a lone surrogate, then more than 256 CODE POINTS (not bytes, not UTF-16 units; the matcher is not run), then match or mismatch", reqs: [R-VALUE-SCALAR, R-VALUE-LENGTH, R-VALUE-ORDER, R-VALUE-MISMATCH, R-LIM-VALUE], verify: {vectors: true, plan: [P-05]}}
- {id: O-VA-13, roles: [validator], text: "the evaluator is linear in program size times value length and never backtracks (an automaton or RE2-class evaluator; a backtracking engine is not eligible)", reqs: [R-LINEAR], verify: {plan: [P-01]}}
- {id: O-PR-01, roles: [producer], text: "when building a release: resolve the pin of the composed schema, classify every expression in document order, and refuse the build on a pin error or a refused expression; no fallback to a native engine", reqs: [R-PIN-MISSING, R-SCHEMA-WHOLE, R-SCHEMA-ORDER], verify: {plan: [P-02]}}
- {id: O-PR-02, roles: [producer], text: "refuse to emit a pattern-constrained value that violates its contract (scalar, length, mismatch), checking it itself", reqs: [R-INDEPENDENT-CHECK, R-VALUE-ORDER], verify: {plan: [P-02]}}
- {id: O-VF-01, roles: [verifier], text: "repeat steps 1 to 3 of the validation order INDEPENDENTLY of the producer: never rely on a producer-supplied verdict, version or classification", reqs: [R-INDEPENDENT-CHECK], verify: {plan: [P-02]}}
- {id: O-VF-02, roles: [verifier], text: "a schema is refused before any value is evaluated; values are never evaluated against a refused schema", reqs: [R-PIN-FIRST, R-PREC-TIER], verify: {plan: [P-02, P-07]}}
- {id: O-VF-03, roles: [verifier], text: "a verifier of untrusted input applies its OWN total work budget (the unit PI x code points, summed over the values), reported with its own code, not a pattern code; each distinct expression is compiled once", reqs: [R-VERIFIER-BUDGET], verify: {plan: [P-04]}}
- {id: O-VF-04, roles: [verifier, producer], text: "the run evidence names the implementation that actually ran (name, version, hash of the evaluator) and earlier conformance evidence is not inherited", reqs: [R-VERSION-EVIDENCE], verify: {plan: [P-03]}}
- {id: O-GT-01, roles: [gate], text: "the gate (on hold) runs the approved vectors and the extension cases against every implementation, with the typed exits and the canaries of the existing tooling", reqs: [R-VERSION-EVIDENCE, R-LINEAR], verify: {plan: [P-01, P-03]}}
# The verification plan: what the 513 approved vectors do not cover. status: proposed-extension = new cases, a separate review-required extension, never a change of the approved set;
# non-vector-test = a test that is not a verdict vector; reader-test = a test of the document reader.
plan:
- {id: P-01, status: non-vector-test, reqs: [R-LINEAR], method: "a timing gate on the adversarial corpus of the engine selection (closure-heavy valid patterns, the slowest accepted expressions per PI cap, 256 and 65536 code points) with a DETERMINISTIC work counter (state visits) bounded by c x PI x N where the implementation can count, and a generous wall-time bound otherwise", evidence: "the work counter or the time per case, the implementation identity, one run per machine", cases: "docs/evidence/pattern-engine-selection and pattern-limits-errors corpora"}
- {id: P-02, status: non-vector-test, reqs: [R-INDEPENDENT-CHECK], method: "a producer stub that always reports success and emits violating values and refused expressions; the verifier must refuse them from its own checks; and the reverse: a verifier fed a producer-supplied verdict that disagrees with its own check", evidence: "the verifier's refusal codes per stub case", cases: "to be written with the implementation"}
- {id: P-03, status: non-vector-test, reqs: [R-VERSION-EVIDENCE], method: "the run evidence file lists the interpreter or toolchain, the package or crate versions, the hash of the evaluator source and the lock files, as results/versions.txt of the engine selection; a run without it is INCOMPLETE", evidence: "the versions file of the run", cases: "format of docs/evidence/pattern-engine-selection/results/versions.txt"}
- {id: P-04, status: non-vector-test, reqs: [R-VERIFIER-BUDGET], method: "synthetic schemas of K worst-case contracts and records of M worst-case values: the verifier stops at its budget with its own code; the work is additive in K and M (measured in docs/evidence/pattern-limits-errors/results/aggregate_cost.txt)", evidence: "the budget code and the work spent", cases: "K = 1..32 as in aggregate_cost.txt"}
- {id: P-05, status: non-vector-test, reqs: [R-VALUE-SCALAR, R-VALUE-LENGTH, R-LIM-VALUE], method: "a per-language harness that passes a value as a list of code points: Go and Rust strings cannot hold a lone surrogate, so the not-a-scalar-value verdict is decided by the reader before the conversion, and the length is counted in code points (Go len() and Rust len() count bytes)", evidence: "the harness verdicts for the vectors V-U001 to V-U004 and V-L001 to V-L010", cases: "the approved value vectors, run through the harness"}
- {id: P-06, status: reader-test, reqs: [R-SCHEMA-WHOLE, R-SCHEMA-ORDER], method: "document reader tests: a duplicate key, a syntax error, an expression that is absent or not a string are reader errors with no pattern code; mapping order is source order in every implementation language", evidence: "the reader's error kinds for the cases E-RDR-01 to E-RDR-06 and E-TRV-02", cases: "E-RDR-01..06, E-TRV-02"}
- {id: P-07, status: proposed-extension, reqs: [R-PIN-MISSING, R-PIN-UNKNOWN, R-PIN-CONFLICT, R-PIN-IDENTICAL, R-PIN-FIRST, R-PIN-ONLY-IF-PATTERN], method: "extension cases for the pin: wrong-typed values (true, 1.0, the text 1, null, 0, a negative number, a list, a mapping) are pattern_profile_unknown; conflict precedes unknown; identical wrong-typed declarations are unknown; no pin evaluation without a pattern contract; the pin precedes the expressions", evidence: "the 17 cases E-PIN-01 to E-PIN-17 of extension-cases.yaml, a separately reviewed extension of the approved set", cases: "E-PIN-01..17"}
- {id: P-08, status: proposed-extension, reqs: [R-SCHEMA-ORDER, R-SCHEMA-WHOLE], method: "extension cases for the traversal: the contract is visited where its key stands among its siblings (source order), fields and item_fields by their source position, sequence items by index, non-pattern contracts skipped", evidence: "the 7 cases E-TRV-01 to E-TRV-07 of extension-cases.yaml", cases: "E-TRV-01..07"}
- {id: P-09, status: proposed-extension, reqs: [R-SCHEMA-ORDER], method: "when the composition of the release schemas is specified: cases for pin declarations that come from different parts of a composed schema (the order of the parts is the composition's), and for the order of several violating values in one record (the record reader's order)", evidence: "to be written after the composition rule exists", cases: "open"}
