- {id: E-PIN-17, rule: "O-VA-02 (before every expression)", derive: "the pin true is unknown; the expression (?i)a would be pattern_group_extension, but the pin is evaluated before every expression; the schema is refused with the pin code", depends: [D1], verifies: [R-PIN-FIRST], related: [], status: proposed}
