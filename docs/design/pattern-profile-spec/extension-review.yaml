# The REVIEW DATA of the 47 proposed extension cases (extension-cases.yaml): for each case the derivation of its expected result from the TEXT of the implementation specification (docs/en/GRAMMAR-PATTERN-IMPLEMENTATION-SPEC.md),
# the owner decisions it depends on, and its adoption status. The cases are NOT part of the 513 approved vectors; this file does not change them. `rule` names the rule of the specification the derivation uses
# (section and obligation); `derive` is the derivation in steps; `depends` lists the decisions D1 to D6 whose confirmation the case needs (D7 and D8 are on hold and no case depends on them); `status` is proposed for all. `verifies` lists the requirements that the expected result of the case really states (a case may verify a requirement only if its outcome is of the kind the requirement states); `related` lists the requirements the case only touches (a reader error is never a pattern verdict, so a reader-error case verifies none and is related to the requirement it concerns); the coverage of a requirement counts the verifying cases only.
# D1 a wrong-typed pin is pattern_profile_unknown, no new code; D2 an explicit null declaration is unknown; D3 a schema without a pattern contract evaluates no pin; D4 the traversal is source order;
# D5 an expression that is not a string is a reader error; D6 the schema layer's own error vocabulary is a separate contract.
review_format: 2
groups:
  E-PIN: {purpose: "pin resolution: wrong types, conflict before unknown, identical declarations, the type-sensitive identity of declared values, the type-preserving reader", depends: [D1, D2, D3, D6]}
  E-TRV: {purpose: "the document-order traversal of nested contracts: the first refused contract in source order decides code and path", depends: [D4]}
  E-RDR: {purpose: "the reader boundary: errors that never reach the validator and have no pattern code", depends: [D5, D6]}
cases:
- {id: E-PIN-01, rule: "O-VA-01 step 3", derive: "one declaration, the value true; not the int 1 (a bool is not an int); so the single value is unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-02, rule: "O-VA-01 step 3", derive: "one declaration, 1.0; a float is not the int 1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-03, rule: "O-VA-01 step 3", derive: "one declaration, the text 1; a string is not the int 1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-04, rule: "O-VA-01 step 3, O-RD-04", derive: "one declaration whose value is null (the key is present, so it is a declaration, not a missing pin); null is not the int 1; unknown", depends: [D1, D2], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-05, rule: "O-VA-01 step 3", derive: "one declaration, the int 0; an int but not 1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-06, rule: "O-VA-01 step 3", derive: "one declaration, the int -1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-07, rule: "O-VA-01 step 3", derive: "one declaration, a list; not the int 1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-08, rule: "O-VA-01 step 3", derive: "one declaration, a mapping; not the int 1; unknown", depends: [D1], verifies: [R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-09, rule: "O-VA-01 step 2, identity table", derive: "declarations 1 and true: different type classes (a bool is not an int), so not identical; conflict (step 2 precedes step 3)", depends: [D1], verifies: [R-PIN-CONFLICT], related: [], status: proposed}
- {id: E-PIN-10, rule: "O-VA-01 step 2, identity table", derive: "declarations 1 and the text 1: different type classes; conflict", depends: [D1], verifies: [R-PIN-CONFLICT], related: [], status: proposed}
- {id: E-PIN-11, rule: "O-VA-01 step 2", derive: "declarations 1 and 99: both ints but different values, so not identical; conflict, although 99 alone would be unknown (conflict precedes unknown)", depends: [D1], verifies: [R-PIN-CONFLICT], related: [R-PIN-UNKNOWN], status: proposed}
- {id: E-PIN-12, rule: "O-VA-01 step 3", derive: "declarations true and true: identical (same type class, same truth value), count as one; the single value true is not the int 1; unknown", depends: [D1], verifies: [R-PIN-IDENTICAL, R-PIN-UNKNOWN], related: [], status: proposed}
- {id: E-PIN-13, rule: "O-VA-01 step 1", derive: "no declaration while the schema has a pattern contract; missing", depends: [], verifies: [R-PIN-MISSING], related: [], status: proposed}
- {id: E-PIN-14, rule: "O-VA-02", derive: "the schema has no pattern contract, so the pin is not evaluated whatever it is (99 would be unknown); accepted", depends: [D3], verifies: [R-PIN-ONLY-IF-PATTERN], related: [], status: proposed}
