# DRAFT: the kind part of ModuleRelease. No new record members: the shipped descriptor and the WASM bytes are bound through artifacts.files (module release plan).
spec:
  identity:
    atomic_ref: "cic:core:Identity@v0.2.0"
    kind: ModuleReleaseKindPart
    namespace: "cic:release"
    version: v0.0.1
  config_surface:
    aggregate_ref: "cic:core:ConfigSurface@v0.2.0"
    nodes: []
    validation:
      - {type: must, expression: "kind = 'ModuleRelease'"}
      - {type: must, expression: "count(artifacts/files[path = 'module/module.wasm']) = 1"}
      - {type: must, expression: "count(artifacts/files[path = 'project.yaml']) = 1"}
