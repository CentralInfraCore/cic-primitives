further_requirements:
- id: V01
  owner: verifier
  status: implemented
  reasons:
  - artifact_path_form
  - artifact_path_duplicate
  note: the path form of contract section 7 and path uniqueness; a regular expression of unspecified flavor would not carry the form
- id: V02
  owner: verifier
  status: implemented
  reasons:
  - artifacts_missing
  note: artifacts or artifacts.files absent or empty (also a Form min_items 1 / mandatory matter; the verifier is the named executor of the reason)
- id: V03
  owner: verifier
  status: implemented
  reasons:
  - artifact_order
  note: sorted by the UTF-8 bytes of the path; not the grammar's 'ordered' flag
- id: V04
  owner: verifier
  status: implemented
  reasons:
  - artifact_manifest_mismatch
  note: recomputation of the manifest digest
- id: V05
  owner: verifier
  status: implemented
  reasons:
  - artifact_absent
  - artifact_digest_mismatch
  - artifact_not_regular
  note: the blob layer
- id: V06
  owner: verifier
  status: implemented
  reasons:
  - spec_source_path_duplicate
  note: 'PrimitiveRelease-specific: two specs entries share a source_path (the Form''s list key identity is a separate, partial executor; the reason belongs to the verifier)'
- id: V07
  owner: verifier
  status: implemented
  reasons:
  - build_hash_mismatch
  note: recomputation of the build hash over the covered members (the pattern C-entry only checks the form)
global_requirements:
- id: G01
  scope: whole record, admission profile A (plan section 5)
  owner: verifier
  status: planned
  reasons:
  - reading_differs
  - reading_key_differs
  - reading_structure_differs
  - reading_value_differs
  - duplicate_key
  - key_not_string
  text: 'Interpretation identity: every required reader derives the same typed value tree (keys, structure, type and value of every node, including the inside of opaque members); keys are strings only.'
- id: G02
  scope: whole record, admission profile A
  owner: verifier
  status: planned
  reasons:
  - value_type_unsupported
  text: 'Closed value domain over the WHOLE value tree, opaque member contents included: null, boolean, integer with absolute value at most 2^53-1, string. Not only the declared integer fields. OPEN (P7): the plan names no separate reason for an out-of-range
    integer; value_type_unsupported is used until the owner decides.'
- id: G03
  scope: raw parse, admission profile A
  owner: verifier
  status: planned
  reasons:
  - alias_forbidden
  - merge_key_forbidden
  - tag_forbidden
  - multiple_documents
  - encoding_form
  text: Pre-tree rules on the raw parse, before any tree is built (plan section 5).
- id: G04
  scope: composition
  owner: composition
  status: implemented_draft
  reasons:
  - schema_field_collision
  text: 'Composition adds fields only; an overlap, an attribute conflict or a duplicate name is an error. Executed by the draft compose.py (not a production tool); owner of the rule: the release contract (P3).'
