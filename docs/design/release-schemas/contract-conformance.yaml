    type: pattern
    expression: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
    form: {status: unevaluated}
    verifier: {reasons: [], note: "not checked by the reference verifier; the form of 'version' is checked by release.schema.yaml today"}
    evidence: {planned_vector_class: "common envelope / kind (conformance vector plan, section 8)"}
