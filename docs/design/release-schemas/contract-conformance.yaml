# DRAFT: the machine-checkable conformance declaration of the contracts declared in the release schema parts.
# Layers (D2): the normative schema says WHAT must hold; the Form says what it CAN evaluate (status below, measured); the verifier says which further
# checks it makes (reason identifiers of docs/en/RELEASE-RECORD-CONTRACT.md section 11 and the generalization plan); evidence says what shows the check ran.
# The evaluation status lives ONLY here, never in the schema parts. Checked by check_declaration.py against the parts and the probe output.
# Every normative requirement has a named owner and an explicit status (implemented | planned | not_implemented | implemented_draft); a requirement with no executor is
# declared not_implemented, never left silent. further_requirements = rules a schema cannot express as a contract; global_requirements = whole-record rules.
# check_declaration.py accounts for every known reason identifier: one with no owner here is an error.
