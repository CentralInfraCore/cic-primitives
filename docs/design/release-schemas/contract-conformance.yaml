# Rules a schema cannot express as a contract, kept as named verifier checks (no contract entry exists for them):
verifier_only:
  - {check: "artifact_path_form", note: "the path form of contract section 7 (no control character, no '..', ...): a regular expression of unspecified flavor would not carry it"}
  - {check: "artifact_order", note: "sorted by the UTF-8 bytes of the path; not the grammar's 'ordered' flag"}
  - {check: "artifact_manifest_mismatch", note: "recomputation of the manifest digest"}
  - {check: "artifact_absent / artifact_digest_mismatch / artifact_not_regular", note: "the blob layer"}
  - {check: "build_hash_mismatch (recomputation)", note: "the integrity of the covered members"}
  - {check: "signature_invalid / countersign_invalid (cryptography)", note: "the signatures"}
  - {check: "reading_differs / duplicate_key / key_not_string / value_type_unsupported", note: "the admission profile A (plan section 5)"}
