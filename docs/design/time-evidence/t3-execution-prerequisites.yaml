# THE T3 DECISIONS AS PROPOSED, AND THE PREREQUISITES OF THE TIME-STAMPING (the 92 open records). A RECORD, documentation only: it performs nothing. It keeps three things apart, as the G-0 record does:
#  (1) the DECISIONS (Q1a, Q1b, Q2, Q3, Q6): the requirements that BECOME BINDING when the owner confirms them; today every one is `proposed` (a reviewer's recommendation of 2026-11-23, not an owner decision);
#  (2) the CONDITIONS still to be VERIFIED before the time-stamping may be performed (provider terms, access, trust anchors, storage, restore drills): each is `open` until it has evidence that the check can read;
#  (3) the EXECUTION GO: a separate owner act to PERFORM the time-stamping; `execution_go` is null and this file can never state it. Checked by docs/evidence/time-execution-prereq/check_t3_readiness.py.
prerequisites_format: 1
source: {kind: reviewer_recommendation, date: 2026-11-23, reference: "the review text pasted into the working session by the owner on 2026-11-23, headed 'T3 - javasolt tulajdonosi hatarozatok' (the five proposed resolutions Q1a, Q1b, Q2, Q3, Q6)", authenticity: "a transcribed recommendation: not signed, not verifiable by this repository; it is NOT an owner decision until the owner confirms it"}
execution_go: null
