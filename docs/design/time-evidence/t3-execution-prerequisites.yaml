  authenticity: "a transcribed statement: NOT signed and not verifiable by this repository; the check verifies its FORM only"
  verbatim: |
    **T3 – tulajdonosi döntés és korlátozott GO**

    A T3 `ad3e89f20f3d30db005b0e1a0b0c5e6af438a3f0` fejen rögzített döntési javaslatok alapján:

    - **Q1a: CONFIRMED** – mind a 92 rekord, pontos rekordbájt-digestekkel és teljes halmazellenőrzéssel.
    - **Q1b: CONFIRMED** – a három lejárt template történeti megőrzése, az UNKNOWN rekord külön vizsgálata; újraaláírás vagy kivonás külön döntés.
    - **Q2: CONFIRMED** – két szervezetileg független RFC 3161 TSA. A DigiCert és a GlobalSign csak feltételes jelölt, végleges választás a feltételek bizonyítása után.
    - **Q3: CONFIRMED** – cél 2026-11-30, belső végső határ 2026-12-15.
    - **Q6: CONFIRMED** – három példány, legalább két független hibadomén, legalább tízéves tervezett megőrzés, évenkénti ellenőrzés és bizonyítékmegújítási terv.
    - **Q6a: CONFIRMED, chosen: staged** – a GO előtt két előkészített, visszaellenőrzött tárolási hely; az időbélyegzés után azonnali kétpéldányos megőrzés; legkésőbb december 15-ig a teljes hárompéldányos megőrzés ellenőrzése.

    A határozatokat különítsd el a teljesítendő feltételektől és a tényleges végrehajtási GO-tól.

    **Korlátozott GO:** engedélyezem a DigiCert és a GlobalSign szolgáltatói feltételeinek, RFC 3161-kompatibilitásának, trust anchorjainak, TSA-láncainak és hozzáférési feltételeinek kizárólag olvasási alapú kutatását, valamint ennek bizonyítékokkal alátámasztott dokumentálását.

    A kutatás eredménye nem automatikus feltételteljesítés. Ahol nincs megfelelő bizonyíték, maradjon OPEN.

    **HOLD:** tárolók kiépítése, időbélyegzés, kulcshasználat, merge, implementáció, CI-módosítás, normatív publikálás, G-0 lezárás és factory-naplók feltöltése.

    A lezáró PR csak a dokumentációs feladat lezárása és a végső review után nyitható, kizárólag CI-bizonyíték beszerzésére, külön merge-engedély nélkül.

    Egy dolgot még hozzátennék: **a Q2 szolgáltatói kutatását párhuzamosan kezelném az S3/S10 tárolási döntés előkészítésével**. A november 30-i célhoz nem a manifest algoritmusa jelenti már a fő kockázatot, hanem a külső szolgáltatások hozzáférhetősége és a bizonyítékok biztonságos megőrzése.
