# THE T3 DECISIONS AS PROPOSED, AND THE PREREQUISITES OF THE TIME-STAMPING (the 92 open records). A RECORD, documentation only: it performs nothing. It keeps four things apart:
#  (1) the DECISIONS (Q1a, Q1b, Q2, Q3, Q6, Q6a): the requirements that become binding when the owner confirms them. They were `proposed` (a reviewer's recommendation of 2026-11-23); the owner confirmed all six in a statement the same day (`owner_statement` below), Q6a with the order `staged`.
#      A confirmation is a RECORDED STATEMENT (`stated_by: owner`, a date, a reference): this repository cannot authenticate who wrote it, and the check says so.
#  (2) the CONDITIONS, each in a PHASE: `pre` (must be verified BEFORE the owner's GO), `capture` (can only be verified AFTER the GO, when the tokens exist), `preserve` (the end state, verified after the capture);
#      each is `open` until it has evidence that the check can read. Under the STRICT preservation order the `strict_phase: pre` conditions move from `preserve` to `pre`.
#      A condition that `needs_tokens` (it can only be true when the RFC 3161 tokens exist) is NEVER pre-execution, in either order, and its evidence must be DIGEST-BOUND (`evidence.sha256`).
#  (3) the GO to perform the time-stamping: a SEPARATE owner act (docs/design/time-evidence/t3-execution-go.yaml, absent today); `execution_go` here is null and this file can never state it.
#  (4) the state machine: NOT_PREPARED -> PREPARED_FOR_OWNER_GO -> (the GO record) GO_RECORDED -> EVIDENCE_CAPTURED -> PRESERVATION_COMPLETE. NONE of these is an authorisation; the check never gives the GO.
# Checked by docs/evidence/time-execution-prereq/check_t3_readiness.py.
