decisions:
- id: Q1a
  status: proposed
  confirmation: null
  topic: scope and the manifest
  requirements:
  - "All 92 open records are in scope (the 90 countersigned records of the cic-schema-registry and the 2 cic-yang release records)."
  - "One canonical manifest: for each record its identifier, the SHA-256 of the EXACT record bytes, the repository and the commit and tag references (docs/en/T3-MANIFEST-CONTRACT.md); the manifest holds EXACTLY the expected set of records of the inventory (the same identifiers, commits and refs), not merely the same number."
  - "The digest of the manifest's WHOLE byte stream is what is time-stamped."
- id: Q1b
  status: proposed
  confirmation: null
  topic: the ended and the unknown template releases
  requirements:
  - "The three ended template releases (base@0.5.0, base@0.6.0, golang@0.6.0) are kept as HISTORICAL evidence; their earlier validity is NOT regarded as proved."
  - "Re-signing or retirement of them only by a separate owner decision."
  - "The UNKNOWN state of schema-registry@0.1.0 is settled by a separate investigation."
- id: Q2
  status: proposed
  confirmation: null
  topic: the time-stamp authorities
  requirements:
  - "FINAL requirement: two organisationally INDEPENDENT RFC 3161 time-stamp authorities, both tied to the same canonical digest."
  - "CONDITIONAL choice: the primary candidate is DigiCert, the second candidate GlobalSign; the final selection only after the terms of service, access and the verification chain of each are verified (the conditions C-Q2-*)."
- id: Q3
  status: proposed
  confirmation: null
  topic: the schedule
  requirements:
  - "Execution target: 2026-11-30. Internal latest date: 2026-12-15."
  - "The certificate end of 2026-12-31 13:22:39 UTC is not used as a planned execution time."
- id: Q6
  status: proposed
  confirmation: null
  topic: custody and preservation (the end state)
  requirements:
  - "The manifest, the records, the RFC 3161 tokens, the TSA certificates and the verification aids in at least THREE copies in at least TWO independent storage failure domains: one in immutable object storage, one at a second independent provider, one offline or isolated archive."
  - "The preserved package holds the record bytes (or a digest-verified restorable source), the canonical manifest, the RAW token of each authority, the certificate chains and the frozen version of the verification procedure."
  - "Retention at least 10 years (a PLANNING minimum, not a statement of a legal obligation of the CIC), a restore and cryptographic check every year, and a planned evidence-renewal mechanism for the weakening of hash algorithms and TSA chains."
- id: Q6a
  status: proposed
  confirmation: null
  chosen: null
  topic: the ORDER of the preservation (an alternative for the owner to choose)
  requirements:
  - "STAGED (recommended by the review, with STRICT preconditions): at least TWO separate, verified storage locations are prepared BEFORE the GO (provisioned, a dry-run package read back with its digest verified); the two raw tokens and the certificate chains are placed in both locations IMMEDIATELY after the capture and read back; the three-copy preservation with the restore drills is complete by the internal latest date (2026-12-15)."
  - "STRICT: all three copies, the restore drills and the final package are verified BEFORE the GO (the conditions marked strict_phase move into the pre-execution set); this puts the target date at risk."
  - "The owner chooses `staged` or `strict`; until then Q6a is not confirmed and the record cannot be PREPARED."
