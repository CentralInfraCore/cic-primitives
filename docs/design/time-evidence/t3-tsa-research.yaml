# THE READ-ONLY RESEARCH OF THE TWO TIME-STAMP AUTHORITIES (DigiCert, GlobalSign) for the T3 time-stamping, under the owner's LIMITED GO of 2026-11-23 (docs/design/time-evidence/t3-execution-prerequisites.yaml, limited_go).
# A RESEARCH RECORD, documentation only: nothing was requested from a time-stamp authority (no token, no account, no purchase, no key). Each finding names its SOURCE (a URL, the date it was retrieved and the SHA-256 of the retrieved
# bytes), a short EXCERPT, and what the finding supports; the result is NOT an automatic fulfilment of a condition: a condition is `supported` only with a PRIMARY source that supports it and none that contradicts it, and a
# condition of the readiness record may be `verified` only if the research says `supported` (checked by docs/evidence/time-tsa-research/check_tsa_research.py). Where the evidence is missing the condition stays OPEN.
# source_type: primary (the provider's own page or document), secondary (a reseller or third party that reproduces a provider notice), search_result (only a search engine's summary; it can never support a condition).
# verdict: supports | contradicts | silent (the source is silent on the point) | unclear. decisive: true only if the finding answers the condition itself (not a marketing claim, a neighbouring question or a secondary reproduction).
research_format: 1
retrieved_on: "2026-11-23"
scope: "the terms, RFC 3161 compatibility, trust anchors, TSA chains and access conditions of DigiCert and GlobalSign, read-only"
sources:
  S-DC-KB: {type: primary, url: "https://knowledge.digicert.com/general-information/rfc3161-compliant-time-stamp-authority-server", title: "DigiCert knowledge base INFO4231, RFC3161 compliant Time Stamp Authority (TSA) server", sha256: "f1336ed1b29e4afb"}
  S-DC-CPS: {type: primary, url: "https://digicert.com/content/dam/digicert/pdfs/legal/digicert-cps.pdf", title: "DigiCert Certification Practices Statement v6.01 (2023-09-05)", sha256: "7cbd16bf9960688f"}
  S-DC-EU: {type: primary, url: "https://www.digicert.com/content/dam/digicert/pdfs/legal/digicerteurope-tspps.pdf", title: "DigiCert Europe Time-Stamp Policy Practice Statement v3.0 (2025-11-07)", sha256: "3eb6098378cc1326"}
  S-DC-CERTS: {type: primary, url: "https://knowledge.digicert.com/content/dam/kb/attachments/time-stamp/", title: "the responder, CA and root certificates linked from S-DC-KB (kept in docs/evidence/time-tsa-research/digicert/)", sha256: "see the file digests in results/digicert-chain-verification.txt"}
  S-GS-PRODUCT: {type: primary, url: "https://www.globalsign.com/en/timestamp-service", title: "GlobalSign, Enterprise Timestamping-as-a-Service", sha256: "be5e7ac05787ad13"}
  S-GS-NOTICE: {type: secondary, url: "https://www.tbs-certificates.co.uk/FAQ/en/serveur-horodatage-globalsign-2025.html", title: "TBS CERTIFICATES (a reseller), reproduction of GlobalSign's notice of 2025-12 on the new timestamp URLs", sha256: "22f7f0380246e388"}
  S-GS-SA: {type: primary, url: "https://globalsign.com/en/repository/GlobalSign_TimeStamping_SA_v1.0.pdf", title: "GlobalSign Subscriber Agreement for TimeStamping and TimeAuthority Certificates v1.0", sha256: "dbf81ca70f91e72c"}
  S-GS-SEARCH: {type: search_result, url: "https://www.globalsign.com/en/repository", title: "a web search's summary of GlobalSign's repository documents (not read)", sha256: "none: a search summary, not retrieved bytes"}
findings:
- {id: R-DC-01, decisive: true, provider: DigiCert, topic: rfc3161, source: S-DC-KB, verdict: supports, excerpt: "DigiCert offers an RFC 3161 timestamp server", finding: "DigiCert documents an RFC 3161 time-stamp server at http://timestamp.digicert.com. The three tokens obtained on 2026-11-03 (evidence/time/digicert-2026-11-03/) are evidence that the service accepted our request form (a SHA-256 digest, a nonce, a request for the TSA certificate) and answered with verifiable tokens.", limits: "a documented claim plus PAST behaviour; no request was made today (a request would be a time stamp, which is on hold)"}
- {id: R-DC-02, decisive: false, provider: DigiCert, topic: chain, source: S-DC-CERTS, verdict: supports, excerpt: "DigiCertSHA256RSA4096TimestampResponder20261.cer DigiCertSHA384RSA4096TimestampResponder20261.cer DigiCertSHA512RSA4096TimestampResponder20261.cer DigiCertTrustedG4TimeStampingRSA4096SHA2562025CA1.pem DigiCertTrustedRootG4.cer", finding: "The knowledge base links the responder certificates (SHA-256, SHA-384, SHA-512, 2026 generation), the time-stamping CA and a root. All five were downloaded and kept. The three responders verify, purpose timestampsign, through the published CA (DigiCert Trusted G4 TimeStamping RSA4096 SHA256 2025 CA1) to the SELF-SIGNED DigiCert Trusted Root G4, the anchor kept on 2026-11-03 (SHA-256 55:2F:7B:DC:...:99:88, checked then against the operating system store and DigiCert's page). The file the page calls DigiCertTrustedRootG4.cer is the CROSS-SIGNED root (issuer DigiCert Assured ID Root CA, valid to 2031-11-09, a different fingerprint): it is NOT the anchor.", limits: "the PUBLISHED chain is verified; the responder certificate that will sign the NEW tokens is known only from the tokens themselves and is verified at the capture (condition C-CAP-1)"}
- {id: R-DC-03, decisive: false, provider: DigiCert, topic: terms, source: S-DC-KB, verdict: silent, excerpt: "The RFC 3151 timestamping URL http://timestamp.digicert.com", finding: "The knowledge-base page names the URL and the chain and states no terms of use, no permission to use the endpoint and no limit. DigiCert's CPS v6.01 (S-DC-CPS) covers certificates and names Time Stamp Token Requesters and Time Stamp Verifiers as parties, but contains no permission or restriction for the public endpoint; the DigiCert Europe Time-Stamp Policy (S-DC-EU) is the policy of a DIFFERENT service (the DCEU-TSA, whose subscribers have an agreement with DigiCert Europe).", limits: "the absence of a statement is not a permission and not a prohibition; nothing was asked of DigiCert"}
- {id: R-DC-04, decisive: false, provider: DigiCert, topic: access, source: S-DC-KB, verdict: unclear, excerpt: "TSA certificates are updated at least every 15 months", finding: "No account, credential or fee is mentioned for the endpoint, and the tokens of 2026-11-03 were obtained without any. Future availability and rate limits are not stated. The page says TSA certificates are updated at least every 15 months, while the 2026 responder certificates carry a validity of 2026-08-05 to 2037-11-04; the two are not reconciled by the sources (a short key period under a long certificate is possible).", limits: "past behaviour only; the verification procedure must keep the responder certificate of each token it verifies"}
- {id: R-GS-01, decisive: false, provider: GlobalSign, topic: rfc3161, source: S-GS-PRODUCT, verdict: supports, excerpt: "Built on RFC 3161 standards and integrated with AATL, it guarantees Long-Term Validation (LTV)", finding: "GlobalSign advertises a trusted time-stamping service built on RFC 3161, integrated through a REST API or, for Code Signing customers, a secure URL.", limits: "a marketing page of a commercial product; it does not state that the public endpoint accepts a request for an arbitrary digest from a non-customer"}
- {id: R-GS-02, decisive: false, provider: GlobalSign, topic: endpoint, source: S-GS-NOTICE, verdict: supports, excerpt: "URL: http://timestamp.globalsign.com/tsa/r45standard Application type: timestamp-query", finding: "A reseller reproduces GlobalSign's notice: the RFC 3161 URL is http://timestamp.globalsign.com/tsa/r45standard (application type timestamp-query), issued by the GlobalSign Offline R45 Timestamping CA 2025; from 2026-03-04 the older URLs (…/tsa/r6advanced1) are redirected to the R45 hierarchy.", limits: "SECONDARY source: GlobalSign's own page for this notice was not located; the endpoint was not contacted"}
- {id: R-GS-03, decisive: false, provider: GlobalSign, topic: chain, source: S-GS-NOTICE, verdict: silent, excerpt: "GlobalSign Offline R45 Timestamping CA 2025", finding: "The time-stamping CA is named, but the root of the R45 hierarchy, the CA certificate and an independent trust anchor were NOT obtained or checked.", limits: "not done"}
- {id: R-GS-04, decisive: false, provider: GlobalSign, topic: terms-and-access, source: S-GS-PRODUCT, verdict: silent, excerpt: "Already have a GlobalSign account? Log in to your account to purchase", finding: "The product page is a purchase flow (an account, a price 'From / year'): a commercial service. The Subscriber Agreement for TimeStamping and TimeAuthority Certificates (S-GS-SA) is about CERTIFICATES issued to a subscriber, not the terms of using the time-stamp service; no terms of use, eligibility or rate limit of the public endpoint were found. A web search surfaced terms of a Japanese accredited time-stamp product that ask the customer not to share the URL or credentials and set a request rate (S-GS-SEARCH): a search summary of a DIFFERENT product, not read and not relied on.", limits: "whether a non-code-signing customer may use the endpoint for this purpose, at what cost and with what limit is UNKNOWN; nothing was asked of GlobalSign"}
- {id: R-IND-01, decisive: false, provider: both, topic: independence, source: S-GS-NOTICE, verdict: unclear, excerpt: "the new GlobalSign Offline R45 Timestamping CA 2025 certificate authority", finding: "By the names in the sources the two authorities are operated by different organisations (DigiCert, Inc.; GlobalSign) under different hierarchies (DigiCert Trusted Root G4; the GlobalSign R45 hierarchy). Ownership, shared infrastructure or common dependencies were NOT examined.", limits: "organisational independence in the sense of the resolution is not shown, only different names and hierarchies"}
conditions:
- {id: C-Q2-1, status: supported, findings: [R-DC-01], note: "DigiCert RFC 3161 compatibility: a documented endpoint and the verified past tokens"}
- {id: C-Q2-2, status: open, findings: [R-DC-02], note: "DigiCert: the PUBLISHED chain verifies to the independent anchor (R-DC-02), but the condition asks for the chain of the NEW tokens, which exist only after the GO; it stays open and is closed by the capture-time check (C-CAP-1)"}
- {id: C-Q2-3, status: open, findings: [R-DC-03, R-DC-04], note: "DigiCert terms and permission: the sources are silent, nothing was asked"}
- {id: C-Q2-4, status: open, findings: [R-GS-01, R-GS-02], note: "GlobalSign RFC 3161 compatibility: a marketing claim and a secondary notice; the request form was not tested"}
- {id: C-Q2-5, status: open, findings: [R-GS-03], note: "GlobalSign chain and anchor: not obtained"}
- {id: C-Q2-6, status: open, findings: [R-GS-04], note: "GlobalSign terms, eligibility and access: a commercial account is implied, the terms are not found"}
- {id: C-Q2-7, status: open, findings: [R-IND-01], note: "independence: different names and hierarchies only"}
