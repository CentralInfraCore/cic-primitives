---
# The schema gate. Runs the same checks `make validate` runs locally, but
# without Docker: CI calls `make validate.local`, so the gate has one
# definition (the Makefile) instead of one there and a copy here.
#
# What it proves:
#   * the atom grammar's self-test still rejects all 19 deliberately broken
#     fixtures — a gate nobody has shown capable of failing is not a gate
#   * every live composition satisfies the grammar
#   * every schema still validates against the meta-schema, and every
#     DomainComposition against its base aggregate
#   * the compiler's own test suite still passes, above a coverage floor — it
#     was outside the gate entirely while five of its tests had been failing
#     against the build_hash contract
#   * the imported paths still match the tags they claim (report-only here:
#     this repository is the source of the primitive set, not a consumer)
#
# Deliberately NOT here: pledge, release and verify-release. Those need Vault
# credentials and are a release action, not a gate.

name: gate

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        # requirements.txt is the lock file; using it as a constraints file
        # keeps the pins without installing the linting and mutation-testing
        # stack a validation run does not need.
        #
        # The extras are stripped because pip rejects them in a constraints
        # file ("Constraints cannot have extras" — coverage[toml] is the one
        # such line). Stripping keeps every pin; it only drops the optional
        # dependency groups, which are irrelevant here since these packages
        # are constraints, not installs.
        run: |
          python -m pip install --upgrade pip
          sed -E 's/\[[^]]*\]//' requirements.txt > /tmp/gate-constraints.txt
          pip install -c /tmp/gate-constraints.txt \
            pyyaml jsonschema semver requests cryptography \
            pytest pytest-mock pytest-cov
        # `requests` is not used by the validate path, but compiler.py imports
        # it at module level (line 7) alongside semver, so the module will not
        # load without it. Listed here rather than made lazy, because changing
        # the import structure of the release tooling is not this change's job.

      - name: Gate
        run: make gate.local
