- id: expansion.collapse-default
  kind: roundtrip
  polarity: positive
  adr: ADR-0001
  covers:
  - lossless-normalize
  title: authored short collapses back to short
  input:
    node: 4
    authored_expanded: false
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    form: short
    equal: true
- id: expansion.collapse-authored-expanded
  kind: roundtrip
  polarity: positive
  adr: ADR-0001
  covers:
  - lossless-normalize
  title: an authored expanded node stays expanded even equal to defaults
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    authored_expanded: true
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    form: expanded
    equal: true
- id: expansion.collapse-explicit-empty
  kind: roundtrip
  polarity: positive
  adr: D-018
  covers:
