# Golden vectors for access-policy/1 (expansion). Generated once, then maintained by hand.
# Expectations were written from the rules in P0-4-ACCESS-GRAMMAR.md, not copied from the reference model's output.
format: access-vectors/1
suite: expansion
cases:
- id: expansion.short-g1
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - short-to-long
  - symbolic-defaults
  title: short form gives symbolic defaults, not effective permissions
  input:
    node: 4
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    basis: default
- id: expansion.short-g2
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - short-to-long
  - symbolic-defaults
  - legacy-compat
  title: short form under grammar 2 spells the default mode as enum
  input:
    node: 4
    grammar: 2
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: inherit
      default_injection: null
      conformance: implemented
    basis: default
- id: expansion.short-list-value
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - short-to-long
  title: a list value stays the value
  input:
    node:
    - 1
    - 2
    grammar: 1
    position: opaque
    origin: authored
    attested: false
  expect:
    expanded:
      value:
      - 1
      - 2
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    basis: default
- id: expansion.long-full
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - long-form-full
  title: full long form with explicit lists
  input:
    node:
      value: 4
      access:
      - O=a
      modify:
      - O=b
      inherit: false
      default_injection: 0
      conformance: implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access:
      - O=a
      modify:
      - O=b
      inherit: false
      default_injection: 0
      conformance: implemented
    basis: authored_claim
- id: expansion.long-empty-lists
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - empty-is-not-inherit
  - long-form-full
  title: '[] is preserved: explicit empty set, not inherit'
  input:
    node:
      value: 4
      access: []
      modify: []
      inherit: true
      default_injection: null
      conformance: implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: []
      modify: []
      inherit: true
      default_injection: null
      conformance: implemented
    basis: authored_claim
- id: expansion.long-symbols
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - long-form-full
  title: symbol inherit is preserved as the symbol
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    basis: authored_claim
- id: expansion.long-false-stays-false
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - inheritance-three-states
  - no-implicit-spelling-change
  title: 'inherit: false is not turned into 0'
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: false
      default_injection: null
      conformance: implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: false
      default_injection: null
      conformance: implemented
    basis: authored_claim
- id: expansion.long-zero-stays-zero
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - inheritance-three-states
  - no-implicit-spelling-change
  title: 'inherit: 0 is not turned into false'
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: 0
      default_injection: null
      conformance: implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: 0
      default_injection: null
      conformance: implemented
    basis: authored_claim
- id: expansion.long-g2-enum
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - inheritance-three-states
  - legacy-compat
  title: grammar 2 long form with enum
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: reset
      default_injection: null
      conformance: implemented
    grammar: 2
    position: scalar
    origin: authored
    attested: false
  expect:
    expanded:
      value: 4
      access: inherit
      modify: inherit
      inherit: reset
      default_injection: null
      conformance: implemented
    basis: authored_claim
- id: expansion.partial-map-opaque
  kind: expand
  polarity: positive
  adr: D-018
  covers:
  - partial-long-form
  title: a partial long form at an opaque position is data, never an override
  input:
    node:
      value: 1
      access:
      - O=a
    grammar: 1
    position: opaque
    origin: authored
    attested: false
  expect:
    expanded:
      value:
        value: 1
        access:
        - O=a
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
    basis: default
- id: expansion.partial-map-scalar
  kind: expand
  polarity: negative
  adr: D-018
  covers:
  - partial-long-form
  title: a partial long form at a scalar position is an error
  input:
    node:
      value: 1
      access:
      - O=a
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    error: MAP_AT_SCALAR_POSITION
- id: expansion.extra-key
  kind: expand
  polarity: negative
  adr: ADR-0001
  covers:
  - partial-long-form
  title: all six keys plus another is never read as data
  input:
    node:
      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: implemented
      extra: 1
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    error: EXPANDED_WITH_EXTRA_KEY
- id: expansion.long-symbol-in-list
  kind: expand
  polarity: negative
  adr: D-018
  covers:
