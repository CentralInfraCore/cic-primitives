      value: 4
      access: inherit
      modify: inherit
      inherit: true
      default_injection: null
      conformance: not_implemented
    grammar: 1
    position: scalar
    origin: authored
    attested: false
  expect:
    error: CONFORMANCE_NOT_AUTHORABLE
