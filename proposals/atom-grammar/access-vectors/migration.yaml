# Golden vectors for access-policy/1 (migration). Generated once, then maintained by hand.
# Expectations were written from the rules in P0-4-ACCESS-GRAMMAR.md, not copied from the reference model's output.
format: access-vectors/1
suite: migration
cases:
- id: migration.mode-1-to-2-True
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: True migrates 1->2 without loss
  input:
    value: true
    from: 1
    to: 2
  expect:
    value: inherit
- id: migration.mode-1-to-2-False
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: False migrates 1->2 without loss
  input:
    value: false
    from: 1
    to: 2
  expect:
    value: no-inherit
- id: migration.mode-1-to-2-0
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: 0 migrates 1->2 without loss
  input:
    value: 0
    from: 1
    to: 2
  expect:
    value: reset
- id: migration.mode-2-to-1-inherit
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: '''inherit'' migrates 2->1 without loss'
  input:
    value: inherit
    from: 2
    to: 1
  expect:
    value: true
- id: migration.mode-2-to-1-no-inherit
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: '''no-inherit'' migrates 2->1 without loss'
  input:
    value: no-inherit
    from: 2
    to: 1
  expect:
    value: false
- id: migration.mode-2-to-1-reset
  kind: migrate_mode
  polarity: positive
  adr: D-018
  covers:
  - legacy-compat
  - migration-lossless
  title: '''reset'' migrates 2->1 without loss'
  input:
    value: reset
    from: 2
    to: 1
  expect:
    value: 0
- id: migration.no-implicit-reading-of-enum-in-1
  kind: migrate_mode
  polarity: negative
  adr: D-018
  covers:
  - no-implicit-spelling-change
  title: an enum spelling is not a grammar-1 value
  input:
    value: reset
    from: 1
    to: 2
  expect:
    error: INHERIT_ENUM_IN_GRAMMAR_1
- id: migration.no-implicit-reading-of-legacy-in-2
  kind: migrate_mode
  polarity: negative
  adr: D-018
  covers:
  - no-implicit-spelling-change
  title: a legacy scalar is not a grammar-2 value
  input:
    value: 0
    from: 2
    to: 1
  expect:
    error: LEGACY_INHERIT_IN_GRAMMAR_2
