# Golden vectors for access-policy/1 (resolution). Generated once, then maintained by hand.
# Expectations were written from the rules in P0-4-ACCESS-GRAMMAR.md, not copied from the reference model's output.
format: access-vectors/1
suite: resolution
cases:
- id: resolution.field-explicit-match
  kind: resolve
  polarity: positive
  adr: D-018
  covers:
  - priority-order
  title: explicit field list that matches
  input:
    grammar: 1
    ctx:
      objects:
        c:
          parent: null
          policy: absent
    target:
      object: c
      surface: config_surface
      field:
        access:
        - O=acme
    req:
      op: access
      requestor:
        authenticated: true
        subject: O=acme,OU=ops
        identity: alice
  expect:
    outcome: allow
    layer: field
    code: null
- id: resolution.field-explicit-no-match
  kind: resolve
  polarity: negative
  adr: D-018
  covers:
  - explicit-ban-terminal
  title: an explicit list that does not match is terminal, the open default does not rescue
  input:
    grammar: 1
    ctx:
      objects:
        p:
          parent: null
          policy:
            default_access: open
        c:
          parent: p
          policy: absent
    target:
      object: c
      surface: config_surface
      field:
        access:
        - O=other
    req:
      op: access
      requestor:
        authenticated: true
        subject: O=acme,OU=ops
        identity: alice
  expect:
    outcome: deny
    layer: field
    code: NO_PATTERN_MATCH
