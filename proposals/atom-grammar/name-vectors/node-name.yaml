# Golden vectors of the node-name grammar (cic-primitives #39, decision D1; design: docs/en/GRAMMAR-NODE-NAME-PROFILE-DESIGN.md).
# FOUR verdicts per name, because the V1 behaviors differ and one column would hide it:
#   v1_rule     the normative V1 rule, a full match of the V1 pattern
#   v1_checker  the historical behavior of the pinned V1 checker (commit 73ae469): it accepts ONE line feed after a valid name (a flavor defect, decision O3)
#   v1_forms    the behavior of the Forms (cic-primitive-forms 2f02a75, measured: docs/evidence/grammar-node-name-measurement/); `unmeasured` when no case exists
#   v2          the single enforced verdict of version 2 (R1 as a full match, and no line feed): checker, Go and Rust alike
# The v1 columns are derived by check_name_vectors.py from the V1 pattern and compared (a hand edit cannot move them); the v2 column is run through the real checker.
# The rows where v1_forms is accept and v1_rule is refuse are the names whose verdict would change if the Forms ever enforced the V1 rule: the list of the explicit
# compatibility decision of the design (section 7).
vectors_format: 1
node_name_grammar:
  v1_rule: ^[a-z][a-z0-9_]*$
  v2_rule:
    pattern: ^[a-z][a-zA-Z0-9_]*$
    not_pattern: \n
    full_match: true
  versions_known:
  - 1
  - 2
