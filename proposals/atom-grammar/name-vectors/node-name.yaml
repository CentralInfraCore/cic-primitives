binding:
- id: B01
  description: the context and the pin agree
  context: 2
  pin: 2
  expect: ok
- id: B02
  description: the context supplies no version
  context: null
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_MISSING
- id: B03
  description: the pin declares no version
  context: 2
  pin: null
  expect: NODE_NAME_GRAMMAR_VERSION_MISSING
- id: B04
  description: neither supplies one (no default to 1 or 2)
  context: null
  pin: null
  expect: NODE_NAME_GRAMMAR_VERSION_MISSING
- id: B05
  description: the context expects version 1, the pin declares 2
  context: 1
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_CONFLICT
- id: B06
  description: the context expects 2, the pin declares 1
  context: 2
  pin: 1
  expect: NODE_NAME_GRAMMAR_VERSION_CONFLICT
- id: B07
  description: an unknown integer (3) from the context
  context: 3
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B08
  description: zero from the context
  context: 0
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B09
  description: the string "2" from the context
  context:
    str: '2'
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B10
  description: true from the context (a boolean is not the integer 1)
  context: true
  pin: 1
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B11
  description: the float 2.0 from the context
  context:
    float: 2.0
  pin: 2
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B12
  description: the string "2" declared by the pin
  context: 2
  pin:
    str: '2'
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B13
  description: an unknown integer (3) declared by the pin
  context: 2
  pin: 3
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B14
  description: true declared by the pin
  context: true
  pin: true
  expect: NODE_NAME_GRAMMAR_VERSION_UNKNOWN
- id: B15
  description: both name the known version 1 (the binding is pure; the implemented rule is checked at load time)
  context: 1
  pin: 1
  expect: ok
document_keys:
- id: D01
