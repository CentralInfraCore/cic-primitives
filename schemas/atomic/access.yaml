---
metadata:
  name: Access
  version: v0.0.dev
  description: >
    Atomic primitive wrapping every Shape value with access control.
    Two syntactically equivalent representations:
      key: value
      key: {value: value, access: [...], modify: [...], inherit: true, default_injection: null, conformance: implemented}
    The compiler normalizes the short form to the long form by filling in SYMBOLIC defaults
    (`inherit`, `inherit`, the inherit mode `inherit`, null, `implemented`). Expansion never
    computes an effective permission; resolving one is the job of the PolicySurface
    resolution (proposals/atom-grammar/P0-4-ACCESS-GRAMMAR.md, D-018).
    The runtime always evaluates the expanded form.
    Grammar: access-policy/1. Read that specification for the version rules of the
    `inherit` spelling (legacy `true|false|0`, grammar 1; enum, grammar 2).
  owner: Gabor Zoltan Sinko
  tags:
    - primitive
    - atomic
    - access
    - security
  validatedBy:
    name: cic-primitives
    version: v0.0.dev

spec:
  kind: AtomicPrimitive

  fields:
    description: Internal structure of the Access atom
    properties:
      value:
        type: any
        description: >
          The actual data — its type is determined by the enclosing Shape.
          Short form: `key: value` is equivalent to `key: {value: value, ...}`.

      access:
        type: list<CertPattern> | inherit
        default: inherit
        description: >
          Who may read this value — CertPattern list, OR semantics.
          The symbol `inherit` (the default) means: no field-level rule, resolve from the
          PolicySurface. It is not a CertPattern: `[inherit]` is invalid.
          Empty list `[]`: an explicit empty set, nobody may read (only default_injection is
          visible); resolution never falls back to a more permissive layer.
          Absent key (short form), `null`, `[]` and `inherit` are four different things;
          `null` is invalid.

      modify:
        type: list<CertPattern> | inherit
        default: inherit
        description: >
          Who may write this value — CertPattern list, OR semantics.
          Same value rules as `access`.
          Empty list: nobody may modify (read-only for all requestors).
          Adapter cert appears here for state/operational fields.

      inherit:
        type: InheritanceMode
        default: inherit
        description: >
          Whether sub-objects inherit this field's rule (the field acts as the carrier of the
          sub-object). Values are the three InheritanceMode states, see `inheritance_mode`
          below. Spelling depends on the grammar version of the document: grammar 1 writes
          `true | false | 0` (the historical spelling, a different YAML type each),
          grammar 2 writes `inherit | no-inherit | reset`. The two spellings are never mixed
          and never coerced into each other.

      default_injection:
        type: any
        default: null
        description: >
          What the requestor receives when they lack access to the value.
          null    = field does not appear in the response (information hiding)
          <value> = injected default (e.g. 0, "", false) — uniform behaviour,
                    does not leak whether the field exists or what its value is

      conformance:
        type: enum
        values: [implemented, not_implemented, deprecated]
        default: implemented
        description: >
          Device-level implementation status — separate from permission-based
          visibility (D-012).

          implemented     (default) — field exists and is manageable on the device
          not_implemented — field does NOT exist on the device:
                            read: returns default_injection value (typically null)
                            write: HARD REJECT — "field not implemented on device X"
                            Silent acceptance is FORBIDDEN — the Relay rejects the write
          deprecated      — field exists but should be avoided:
                            read: value returned
                            write: WARNING + accepted

          Difference from missing permission:
            access: []      → PERMISSION DENIED (you cannot access it)
            not_implemented → HARD REJECT (the device cannot handle it)
          The requestor receives a distinct error — the two cases are not interchangeable.

  inheritance_mode:
    description: >
      The type behind `Access.inherit` and `PolicySurface.inherit_policy`. Scope differs:
      Access.inherit governs what a FIELD passes to the sub-object it carries;
      inherit_policy governs what an OBJECT takes from its ancestors' PolicySurface.
    values: [inherit, no-inherit, reset]
    spelling:
      grammar_1: {inherit: true, no-inherit: false, reset: 0}
      grammar_2: {inherit: inherit, no-inherit: no-inherit, reset: reset}
    semantics: >
      inherit    the sub-object may take the parent's rule (field-level: the carrier field's
                 explicit access/modify; object-level: the ancestors' PolicySurface rules).
      no-inherit the carrier field's own rule is not passed down; the sub-object's effective
                 PolicySurface rules (including the ancestors' chain and the documented system
                 default) still apply. Object-level: the ancestors' PolicySurface is not read,
                 local declared rules and the documented system default are used.
      reset      neither the field-level rule nor any ancestor PolicySurface rule nor the
                 system default is used: the sub-object needs an explicit local base for the
                 operation, otherwise resolution denies (fail closed).
      Normative text and vectors: proposals/atom-grammar/P0-4-ACCESS-GRAMMAR.md.

  cert_pattern:
    description: >
      X.509 certificate-based identity pattern. Evaluated against the requestor's mTLS cert.
      Identity source: Subject DN, SAN, or custom X.509 extension —
      implementation detail; the cert PEM is the anchor.
    syntax:
      format: '"field=value" pairs, wildcard (*) supported'
      element: >
        One list element is ONE pattern; the pairs of one pattern are AND-ed, list elements are
        OR-ed. A pattern is a single string without spaces after the commas:
        `"OU=adapters,O=cic"`. The unquoted flow list `[OU=adapters, O=cic]` is two elements
        (two patterns, OR), not one pattern with two pairs.
      combinator: "list = OR — any matching pattern grants access"
    examples:
      - pattern: "O=acme-corp"
        meaning: any acme-corp certificate
      - pattern: "OU=operators,O=acme-corp"
        meaning: acme-corp operator group
      - pattern: "CN=*,O=partner-a"
        meaning: any user of partner-a
      - pattern: "OU=adapters,O=cic"
        meaning: CIC adapter service accounts (for state/operational fields)

  semantic_mapping:
    role_relation: >
      Access atom is orthogonal to Role atom.
      Role = what the field means (config/state/operational).
      Access = who may reach it.
      Combined: role: state + modify: [OU=adapters,O=cic] → adapter writes, user reads.
    compiler:
      short_form: "key: value → key: {value: value, ...inherited rules}"
      normalization: compiler fills in inherited PolicySurface rules
    runtime:
      evaluation: mTLS cert evaluated against the CertPattern list
      miss_behavior: default_injection returned when access is denied
      conformance_enforcement: >
        A write to a not_implemented field is NOT silently dropped by the Relay —
        it is rejected with an explicit "field not implemented on device X" error.
        Distinct from permission denied: the requestor knows the real reason.
    yang:
      note: >
        Analogous to YANG NACM (RFC 8341) — but at field level, not path level.
        During YANG derivation, Access metadata can be translated to NACM rules.
    api:
      note: >
        Fields the requestor cannot access are filtered from the RESTCONF response
        or returned with their default_injection value.
